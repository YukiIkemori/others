<script>
// ==== src/core/ns.js
try{
// ルミナス・クレスト — core namespace & utilities.
// Every source file is wrapped in an IIFE and only *registers* things on RPG at
// load time. Nothing may touch the DOM or another module's runtime state at
// load time; cross-module wiring happens in RPG.boot() (src/main.js).
(function () {
  'use strict';
  const R = (window.RPG = window.RPG || {});

  R.VERSION = '1.0.0';
  R.TITLE = 'ルミナス・クレスト';
  R.W = 256; // logical screen width (SFC)
  R.H = 224; // logical screen height (SFC)
  R.TILE = 16;
  R.SCALE = 3; // backing canvas = 768x672
  R.FPS = 60;

  // Central data registry. Data/art/audio/map/event files fill these with
  // Object.assign(R.DB.xxx, {...}). See DESIGN.md for every schema.
  R.DB = R.DB || {};
  for (const k of [
    'tiles', 'legends', 'themes', 'chars', 'jobs', 'abilities', 'items',
    'shops', 'monsters', 'encounters', 'troops', 'maps', 'events',
    'battlebg', 'music', 'sfx', 'statuses', 'elements', 'locations',
  ]) R.DB[k] = R.DB[k] || {};

  // Load-time error collection (build.js wraps every file in try/catch).
  R.loadErrors = R.loadErrors || [];

  // ---------------------------------------------------------------- RNG
  // Math.random by default; tools/sim can call R.U.seed(n) for determinism.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const U = (R.U = {
    rng: Math.random,
    seed(n) { U.rng = mulberry32(n >>> 0); },
    unseed() { U.rng = Math.random; },
    /** float in [0,1) */
    r() { return U.rng(); },
    /** float in [a,b) */
    rf(a, b) { return a + (b - a) * U.rng(); },
    /** int in [a,b] inclusive */
    ri(a, b) { return a + Math.floor(U.rng() * (b - a + 1)); },
    /** true with probability p (0..1) */
    chance(p) { return U.rng() < p; },
    /** 1 in n */
    oneIn(n) { return n <= 1 || U.rng() * n < 1; },
    pick(arr) { return arr[Math.floor(U.rng() * arr.length)]; },
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(U.rng() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
    /** pick from [{w:number,...}] (or key given) by weight */
    weighted(arr, key = 'w') {
      let total = 0;
      for (const e of arr) total += e[key] || 0;
      let x = U.rng() * total;
      for (const e of arr) { x -= e[key] || 0; if (x < 0) return e; }
      return arr[arr.length - 1];
    },
    clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; },
    lerp(a, b, t) { return a + (b - a) * t; },
    clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
    /** direction helpers: 'up'|'down'|'left'|'right' */
    DIRS: ['down', 'left', 'right', 'up'],
    DX: { up: 0, down: 0, left: -1, right: 1 },
    DY: { up: -1, down: 1, left: 0, right: 0 },
    opposite(d) { return { up: 'down', down: 'up', left: 'right', right: 'left' }[d]; },
    /** pad/format helpers for UI */
    padL(s, n, ch = ' ') { s = String(s); while (s.length < n) s = ch + s; return s; },
    /** Japanese-style number with 全角-free digits */
    num(n) { return String(Math.floor(n)); },
    /** frames -> "hh:mm" */
    playTime(frames) {
      const m = Math.floor(frames / 3600);
      return `${Math.floor(m / 60)}:${U.padL(m % 60, 2, '0')}`;
    },
  });

  // Small event bus for loose coupling (e.g. 'flag', 'mapload', 'battleEnd').
  const listeners = {};
  R.on = function (name, fn) { (listeners[name] = listeners[name] || []).push(fn); };
  R.off = function (name, fn) {
    const l = listeners[name]; if (!l) return;
    const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1);
  };
  R.emit = function (name, ...args) {
    const l = listeners[name]; if (!l) return;
    for (const fn of l.slice()) {
      try { fn(...args); } catch (e) { console.error('[emit ' + name + ']', e); }
    }
  };

  R.warn = function (...a) { console.warn('[RPG]', ...a); };

  // Safe audio wrappers — usable before/without the audio module.
  R.sfx = function (id) { try { if (R.Audio && R.Audio.sfx) R.Audio.sfx(id); } catch (e) { /* ignore */ } };
  R.bgm = function (id, opts) { try { if (R.Audio && R.Audio.playBGM) R.Audio.playBGM(id, opts); } catch (e) { /* ignore */ } };
  /** play a jingle (fanfare) and resolve when it ends (BGM resumes automatically) */
  R.jingle = function (id) {
    try { if (R.Audio && R.Audio.playJingle) return Promise.resolve(R.Audio.playJingle(id)); } catch (e) { /* ignore */ }
    return Promise.resolve();
  };

  // Boot hooks (see main.js)
  R._bootHooks = R._bootHooks || [];
  R.onBoot = function (fn) { R._bootHooks.push(fn); };
})();

}catch(e){(window.RPG=window.RPG||{}).loadErrors=(window.RPG.loadErrors||[]);window.RPG.loadErrors.push("src/core/ns.js"+': '+(e&&e.stack||e));console.error("src/core/ns.js",e);}
// ==== src/core/input.js
try{
// Input: keyboard + on-screen touch pad + gamepad, folded into virtual buttons.
// Buttons: up down left right a b dash
//   a    = Z / Enter / Space      (confirm, talk, examine)
//   b    = X / Esc / Backspace    (cancel; on the field opens the menu)
//   dash = Shift (held)           (inverts the "always dash" setting)
(function (R) {
  'use strict';
  const BTNS = ['up', 'down', 'left', 'right', 'a', 'b', 'dash'];
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    KeyZ: 'a', Enter: 'a', Space: 'a', NumpadEnter: 'a',
    KeyX: 'b', Escape: 'b', Backspace: 'b',
    ShiftLeft: 'dash', ShiftRight: 'dash',
  };
  const REPEAT_DELAY = 16; // frames before auto-repeat
  const REPEAT_RATE = 4; // frames between repeats

  const src = { key: {}, touch: {}, pad: {} }; // raw held state per source
  const held = {}; // merged held state this frame
  const prev = {};
  const heldFrames = {};
  let dirOrder = []; // most recently pressed direction last
  let anyPressedCb = null;

  const Input = (R.Input = {
    enabled: true,
    /** true while held */
    down(b) { return !!held[b]; },
    /** true on the frame the button went down */
    pressed(b) { return !!held[b] && !prev[b]; },
    /** pressed, or auto-repeating while held (menus) */
    repeat(b) {
      if (!held[b]) return false;
      if (!prev[b]) return true;
      const f = heldFrames[b];
      return f >= REPEAT_DELAY && (f - REPEAT_DELAY) % REPEAT_RATE === 0;
    },
    released(b) { return !held[b] && !!prev[b]; },
    /** currently held direction (last pressed wins) or null */
    dir() {
      for (let i = dirOrder.length - 1; i >= 0; i--) if (held[dirOrder[i]]) return dirOrder[i];
      return null;
    },
    /** direction pressed/repeated this frame (menus) or null */
    dirRepeat() {
      for (const d of ['up', 'down', 'left', 'right']) if (Input.repeat(d)) return d;
      return null;
    },
    /** Swallow current presses so a closing window's "A" does not leak into the layer below. */
    consume() { for (const b of BTNS) prev[b] = held[b]; },
    /** Called once per frame by the engine before update(). */
    update() {
      pollGamepad();
      for (const b of BTNS) {
        prev[b] = held[b];

        for (const s of R.Rules.SLOTS) if (c.equip[s] && !DB.items[c.equip[s]]) c.equip[s] = null;
        if (!DB.jobs[c.job]) c.job = DB.chars[c.id].startJob;
        for (const s of R.Rules.SET_SLOTS) if (c.set[s] && !(DB.abilities[c.set[s]] || DB.jobs[c.set[s]])) c.set[s] = null;
      }
      R.Game = g;
      return true;
    },
  });
})(window.RPG);

}catch(e){(window.RPG=window.RPG||{}).loadErrors=(window.RPG.loadErrors||[]);window.RPG.loadErrors.push("src/systems/state.js"+': '+(e&&e.stack||e));console.error("src/systems/state.js",e);}

try{
// Boot: wires modules together once every file has loaded.
// Systems register startup work with R.onBoot(fn) (called in order, after the
// engine & fonts are ready, before the title screen).
(function (R) {
  'use strict';

  function isTouch() {
    const s = R.Settings.touchPad;
    if (s === 'on') return true;
    if (s === 'off') return false;
    return (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
  }
  R.applyTouchSetting = function () {
    document.getElementById('game').classList.toggle('touch', isTouch());
    fit();
  };

  function fit() {
    const game = document.getElementById('game');
    const cv = document.getElementById('screen');
    const pad = document.getElementById('touchpad');
    let w = window.innerWidth, h = window.innerHeight;
    const touch = game.classList.contains('touch');
    const landscape = w > h;
    if (touch && !landscape && pad) h -= Math.max(170, pad.offsetHeight || 0);
    let s = Math.min(w / R.W, h / R.H);
    if (s >= 2) s = Math.max(2, Math.floor(s * 2) / 2); // prefer clean half-steps when large
    cv.style.width = Math.floor(R.W * s) + 'px';
    cv.style.height = Math.floor(R.H * s) + 'px';
  }
  R.fit = fit;

  R.boot = async function () {
    if (R._booted) return;
    R._booted = true;
    R.Save.loadSettings();
    const game = document.getElementById('game');
    const canvas = document.getElementById('screen');
    R.Input.init(game);
    R.applyTouchSetting();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', () => setTimeout(fit, 200));
    R.Engine.start(canvas);

    // Wait (briefly) for the pixel font so the title never flashes a fallback.
    try {
      if (document.fonts && document.fonts.load) {
        await Promise.race([document.fonts.load('32px "DotGothic16"', 'あア亜A'), new Promise((r) => setTimeout(r, 2500))]);
      }
    } catch (e) { /* offline: fallback font */ }

    // Audio can only start after a user gesture.
    R.Input.onAnyPress(() => { try { R.Audio && R.Audio.init && R.Audio.init(); } catch (e) { console.error(e); } });

    for (const fn of R._bootHooks) {
      try { await fn(); } catch (e) { console.error('boot hook failed', e); }
    }
    if (R.loadErrors.length) console.error('LOAD ERRORS:\n' + R.loadErrors.join('\n'));

    if (R.Title && R.Title.start) R.Title.start();
    else {
      // placeholder until the title system exists
      const L = new R.Layer();
      L.opaque = true;
      L.draw = () => { R.Gfx.clear('#000'); R.Gfx.text(R.TITLE, 128, 100, { align: 'center', size: 16 }); };
      R.Engine.push(L);
    }
    R.emit('booted');
  };

  if (document.readyState === 'complete') setTimeout(R.boot, 0);
  else window.addEventListener('load', R.boot);
})(window.RPG);

}catch(e){(window.RPG=window.RPG||{}).loadErrors=(window.RPG.loadErrors||[]);window.RPG.loadErrors.push("src/main.js"+': '+(e&&e.stack||e));console.error("src/main.js",e);}
