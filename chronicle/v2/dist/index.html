// ルミナス・クロニクル 〜八つの灯火〜 v2 — 名前空間（CORE）
// すべてのファイルは IIFE で R（window.RPG）に「登録するだけ」。読み込み時に document に触れない。
// ほかのファイルの物は関数の中でだけ読む（V2_PLAN §0.1 の 0.5、§2.4）。

  // データの登録簿。R.def(kind, id, obj) で登録すると重なりを警告する（上書きしない、§2.4）
  R.DB = R.DB || {};
  for (const k of [
    'config', 'maps', 'events', 'locations', 'regions', 'leads', 'looks', 'items', 'shops', 'pools',
    'heroTypes', 'companions', 'weaponTypes', 'elements', 'statuses', 'techs', 'spells',
    'monsters', 'lineages', 'enemyActions', 'encounters', 'troops', 'bosses', 'bossActions',
    'rare', 'rareEncounters', 'music', 'sfx',
    // 版 2（V2_PLAN §2.11）: 手紙（CONTENT）・説明の札（MENUS）・素材と物の一覧（TERRAIN。node で id を確かめる用）
    'letters', 'tips', 'materials', 'props',
  ]) R.DB[k] = R.DB[k] || {};

  // 読み込みの失敗（build.js が各ファイルを try/catch で包んでここへ積む）と登録の重なり
  R.loadErrors = R.loadErrors || [];

  /** R.DB[kind][id] = obj。同じ id がもうあれば警告して上書きしない（R.loadErrors に積む） */
  R.def = function (kind, id, obj) {
    const t = (R.DB[kind] = R.DB[kind] || {});
    if (Object.prototype.hasOwnProperty.call(t, id)) {
      const msg = `duplicate R.DB.${kind}.${id} (ignored)`;
      R.loadErrors.push(msg);
      console.warn('[RPG]', msg);
      return false;
    }
    t[id] = obj;
    return true;
  };
  /** 表をまとめて登録（R.def を 1 件ずつ） */
  R.defs = function (kind, table) { for (const id of Object.keys(table)) R.def(kind, id, table[id]); };

  R.warn = function (...a) { console.warn('[RPG]', ...a); };

  // ---------------------------------------------------------------- 仮の実装（core/stubs/*.js）
  // 各担当の契約（§2.5）の仮の実装。読み込み時は登録するだけで、全ファイルを読んだ後の R.Stubs.install() が
  // 「まだ無い関数・値」だけを埋める（本物のファイルがあればそちらが勝つ。一部だけ本物でも残りを埋める）。
  // 呼ばれた回数は R.Stubs.calls に数える（QA の check_stubs が「仮の実装が 1 回も呼ばれない」を確かめる）。
  R.Stubs = R.Stubs || { ns: {}, data: [], calls: {}, installed: {}, claimed: {} };
  /**
   * 本物の担当が「この名前空間は全部自分が持つ。仮の実装で穴を埋めないで」と言う（版 2）。
   * 仮の実装の関数どうしは中の状態（例: 仮の FIELD の st）を共有するので、本物と仮が混ざると食い違う。
   * 名前空間を丸ごと本物にしたら、そのファイルの先頭で R.Stubs.claim('Field') を呼ぶ（子の 'Field.camera' なども含む）。
   * 途中までの間は claim しなくてよい（足りない関数だけ仮が埋める。R.Stubs.installed で何が埋まったか見られる）。
   */
  R.Stubs.claim = function (path) { (R.Stubs.claimed = R.Stubs.claimed || {})[path] = true; };
  const isClaimed = (path) => Object.keys(R.Stubs.claimed || {}).some((c) => path === c || path.indexOf(c + '.') === 0);
  /** 名前空間の仮の実装を登録（path は 'Hd'・'UIK.Message' など） */
  R.Stubs.define = function (path, obj) { R.Stubs.ns[path] = Object.defineProperties(R.Stubs.ns[path] || {}, Object.getOwnPropertyDescriptors(obj)); };
  /** データの仮の登録（R.DB[kind][id] が無いときだけ入る） */
  R.Stubs.defineData = function (kind, id, obj) { R.Stubs.data.push({ kind, id, obj }); };
  R.Stubs.install = function () {
    if (R.Stubs._done) return R.Stubs.installed;
    R.Stubs._done = true;
    const paths = Object.keys(R.Stubs.ns).sort((a, b) => a.split('.').length - b.split('.').length);
    for (const path of paths) {
      if (isClaimed(path)) continue;
      const keys = path.split('.');
      let parent = R;
      for (let i = 0; i < keys.length - 1; i++) parent = parent[keys[i]] = parent[keys[i]] || {};
      const last = keys[keys.length - 1];
      const target = parent[last] = parent[last] || {};
      const stub = R.Stubs.ns[path];
      const filled = [];
      for (const k of Object.keys(stub)) {
        if (Object.prototype.hasOwnProperty.call(target, k) || target[k] !== undefined) continue;
        const desc = Object.getOwnPropertyDescriptor(stub, k);
        if (desc.get || desc.set) { Object.defineProperty(target, k, desc); filled.push(k); continue; }
        const v = stub[k];
        if (typeof v === 'function' && !/^class\s/.test(Function.prototype.toString.call(v)) && !/^[A-Z]/.test(k)) {
          const name = path + '.' + k;
          target[k] = function () { R.Stubs.calls[name] = (R.Stubs.calls[name] || 0) + 1; return v.apply(this, arguments); };
        } else target[k] = v;
        filled.push(k);
      }
      if (filled.length) R.Stubs.installed[path] = filled;
    }
    for (const d of R.Stubs.data) {
      const t = (R.DB[d.kind] = R.DB[d.kind] || {});
      if (d.id === '*') { for (const k of Object.keys(d.obj)) if (t[k] === undefined) t[k] = d.obj[k]; continue; }
      if (t[d.id] === undefined) { t[d.id] = d.obj; (R.Stubs.installed['DB.' + d.kind] = R.Stubs.installed['DB.' + d.kind] || []).push(d.id); }
    }
    return R.Stubs.installed;
  };
  /** 呼ばれた仮の実装の一覧 [[name, n]…] */
  R.Stubs.report = function () { return Object.keys(R.Stubs.calls).sort().map((k) => [k, R.Stubs.calls[k]]); };

  // 起動の手順（main.js）: 全ファイル → R.Stubs.install() → R.runDataHooks() → R.onBoot の順
  R._bootHooks = R._bootHooks || [];
  R.onBoot = function (fn) { R._bootHooks.push(fn); };
  R._dataHooks = R._dataHooks || [];
  /** データの後処理（表の展開など）。ブラウザでも node（tools/lib/load.js）でも 1 回だけ。DOM に触れない */
  R.onData = function (fn) { R._dataHooks.push(fn); };
  R.runDataHooks = function () {
    if (R._dataHooksRan) return;
    R._dataHooksRan = true;
    for (const fn of R._dataHooks) {
      try { fn(R); } catch (e) { R.loadErrors.push('onData hook: ' + (e && e.stack || e)); console.error('data hook failed', e); }
    }
  };
})();

      float(a, b) { return a + (b - a) * f(); },

      chance(p) { return f() < p; },

      if (w === 'sine' || w === 'square' || w === 'sawtooth' || w === 'triangle') { osc.type = w; return; }
      let pw = this.waves[w];
      if (!pw) {
        const N = 48;
        const re = new Float32Array(N), im = new Float32Array(N);
        if (PULSE[w]) { const d = PULSE[w]; for (let k = 1; k < N; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * d); }
        else if (WAVES[w]) WAVES[w].forEach((v, k) => { if (k < N) im[k] = v; });
        else { osc.type = 'square'; return; }
        pw = this.waves[w] = this.ctx.createPeriodicWave(re, im);
      }
      osc.setPeriodicWave(pw);
    }
    noiseBuf() {
      if (!this._noise) {
        const c = this.ctx, n = Math.floor(c.sampleRate * 1.5);
        const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
        let s = 0x2545f491;
        for (let i = 0; i < n; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; d[i] = ((s >>> 0) / 4294967296) * 2 - 1; }
        this._noise = b;
      }
      return this._noise;
    }
    // envelope for one-shot sounds: attack a, hold d (or exponential decay), release r
    shape(p, t, o, vol) {
      const a = o.a != null ? o.a : 0.002, d = o.d != null ? o.d : 0.1, r = o.r != null ? o.r : 0.04;
      p.setValueAtTime(0, t);
      p.linearRampToValueAtTime(vol, t + a);
      let end = t + Math.max(a, d);
      if (o.decay) {
        const lv = Math.max(0.0001, vol * (typeof o.decay === 'number' ? o.decay : 0.001));
        p.exponentialRampToValueAtTime(lv, end);
        if (lv > 0.0002) { p.exponentialRampToValueAtTime(0.0001, end + r); end += r; }
      } else {
        p.setValueAtTime(vol, end);
        p.exponentialRampToValueAtTime(0.0001, end + r);
        end += r;
      }
      return end;
    }
    filters(o, t, out) {
      let node = out;
      for (const [k, type] of [['lp', 'lowpass'], ['hp', 'highpass'], ['bp', 'bandpass']]) {
        if (!o[k]) continue;
        const f = this.ctx.createBiquadFilter();
        f.type = type;
        f.Q.value = o.q != null ? o.q : type === 'bandpass' ? 1 : 0.7;
        f.frequency.setValueAtTime(o[k], t);
        if (o[k + '2']) f.frequency.exponentialRampToValueAtTime(o[k + '2'], t + (o.fd || o.d || 0.1));
        f.connect(node);
        node = f;
      }
      return node;
    }
    vibrato(o, t, end, oscs) {
      if (!o.vib) return;
      const c = this.ctx, lfo = c.createOscillator(), g = c.createGain();
      lfo.frequency.value = o.vib[0];
      g.gain.value = o.vib[1];
      lfo.connect(g);
      for (const x of oscs) g.connect(x.detune);
      lfo.start(t); lfo.stop(end);
    }
    /** one-shot oscillator: {t,w,f|n,f2|n2,sd,lin,d,a,r,vol,decay,det,vib,lp/hp/bp(+2),q,fd} */
    tone(dest, o, t0) {
      const c = this.ctx, t = t0 + (o.t || 0);
      const f = o.f || mtof(o.n != null ? o.n : 69);
      const f2 = o.f2 || (o.n2 != null ? mtof(o.n2) : 0);
      const osc = c.createOscillator();
      this.setWave(osc, o.w || 'p50');
      osc.frequency.setValueAtTime(f, t);
      if (f2) {
        const te = t + (o.sd != null ? o.sd : o.d != null ? o.d : 0.1);
        if (o.lin) osc.frequency.linearRampToValueAtTime(f2, te);
        else osc.frequency.exponentialRampToValueAtTime(f2, te);
      }
      if (o.det) osc.detune.value = o.det;
      const g = c.createGain();
      const end = this.shape(g.gain, t, o, o.vol != null ? o.vol : 0.3);
      g.connect(dest);
      osc.connect(this.filters(o, t, g));
      this.vibrato(o, t, end, [osc]);
      osc.start(t); osc.stop(end + 0.01);
      osc.onended = () => g.disconnect();
      return end;
    }
    /** filtered noise burst: same envelope/filter options as tone, plus rate (darker when < 1) */
    noise(dest, o, t0) {
      const c = this.ctx, t = t0 + (o.t || 0);
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf();
      src.loop = true;
      if (o.rate) src.playbackRate.setValueAtTime(o.rate, t);
      if (o.rate2) src.playbackRate.exponentialRampToValueAtTime(o.rate2, t + (o.fd || o.d || 0.1));
      const g = c.createGain();
      const end = this.shape(g.gain, t, o, o.vol != null ? o.vol : 0.3);
      g.connect(dest);
      src.connect(this.filters(o, t, g));
      src.start(t, Math.random() * 1.2);
      src.stop(end + 0.01);
      src.onended = () => g.disconnect();
      return end;
    }
    /** 2-operator FM tone (bells, chimes): {n|f, n2, ratio, index, md (mod decay), d, a, r, vol, decay} */
    fm(dest, o, t0) {
      const c = this.ctx, t = t0 + (o.t || 0);
      const f = o.f || mtof(o.n != null ? o.n : 69);
      const car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
      car.frequency.setValueAtTime(f, t);
      const f2 = o.f2 || (o.n2 != null ? mtof(o.n2) : 0);
      if (f2) car.frequency.exponentialRampToValueAtTime(f2, t + (o.sd || o.d || 0.1));
      const ratio = o.ratio || 2;
      mod.frequency.value = f * ratio;
      const dev = (o.index != null ? o.index : 2) * f * ratio;
      mg.gain.setValueAtTime(dev, t);
      mg.gain.exponentialRampToValueAtTime(Math.max(0.5, dev * 0.03), t + (o.md || 0.3));
      const end = this.shape(g.gain, t, o, o.vol != null ? o.vol : 0.3);
      mod.connect(mg); mg.connect(car.frequency);
      car.connect(this.filters(o, t, g)); g.connect(dest);
      car.start(t); mod.start(t); car.stop(end + 0.01); mod.stop(end + 0.01);
      car.onended = () => g.disconnect();
      return end;
    }
    /** one sequenced note of an instrument */
    voice(inst, dest, midi, t, dur, vel) {
      const c = this.ctx, f = mtof(midi), e = inst.env;
      const g = c.createGain();
      const P = g.gain, peak = inst.vol * vel;
      const a = e[0], d = e[1], s = e[2];
      const end = t + Math.max(0.005, dur);
      let v;
      P.setValueAtTime(0, t);
      if (end <= t + a) { v = peak * (end - t) / a; P.linearRampToValueAtTime(v, end); }
      else {
        P.linearRampToValueAtTime(peak, t + a);
        if (s >= 1 || d <= 0) { v = peak * Math.min(1, s); P.setValueAtTime(v, end); }
        else {
          const tau = d / 3;
          P.setTargetAtTime(peak * s, t + a, tau);
          v = peak * s + peak * (1 - s) * Math.exp(-(end - t - a) / tau);
          P.setValueAtTime(v, end);
        }
      }
      const stop = end + Math.max(0.02, e[3]);
      if (v > 0.0002) P.exponentialRampToValueAtTime(0.0001, stop); else P.linearRampToValueAtTime(0, stop);
      g.connect(dest);
      let head = g;
      if (inst.lp) {
        const L = inst.lp, flt = c.createBiquadFilter();
        flt.type = 'lowpass'; flt.Q.value = L.q || 0.7;
        const base = Math.min(16000, L.f * (L.track ? f / 262 : 1));
        if (L.env) {
          flt.frequency.setValueAtTime(base, t);
          flt.frequency.exponentialRampToValueAtTime(L.env[0], t + L.env[1]);
          flt.frequency.setTargetAtTime(base, t + L.env[1], L.env[2] / 3);
        } else flt.frequency.value = base;
        flt.connect(g);
        head = flt;
      }
      const oscs = [];
      if (inst.fm) {
        const [ratio, index, md] = inst.fm;
        const car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain();
        car.frequency.value = f; mod.frequency.value = f * ratio;
        const dev = index * f * ratio;
        mg.gain.setValueAtTime(dev, t);
        mg.gain.exponentialRampToValueAtTime(Math.max(0.5, dev * 0.04), t + md);
        mod.connect(mg); mg.connect(car.frequency); car.connect(head);
        mod.start(t); mod.stop(stop);
        oscs.push(car);
      } else {
        for (const o of inst.osc) {
          const osc = c.createOscillator();
          this.setWave(osc, o.w);
          const fo = f * (o.mul || 1);
          if (inst.pitch) {
            osc.frequency.setValueAtTime(fo * Math.pow(2, inst.pitch[0] / 12), t);
            osc.frequency.exponentialRampToValueAtTime(fo, t + inst.pitch[1]);
          } else osc.frequency.value = fo;
          if (o.det) osc.detune.value = o.det;
          let dst = head;
          if (o.dec || (o.vol != null && o.vol !== 1)) {
            const og = c.createGain(), ov = o.vol != null ? o.vol : 1;
            if (o.dec) { og.gain.setValueAtTime(ov, t); og.gain.setTargetAtTime(0, t, o.dec / 3); } else og.gain.value = ov;
            og.connect(head); dst = og;
          }
          osc.connect(dst);
          oscs.push(osc);
        }
      }
      if (inst.vib && dur > inst.vib[2] + 0.12) {
        const lfo = c.createOscillator(), lg = c.createGain();
        lfo.frequency.value = inst.vib[0];
        lg.gain.setValueAtTime(0, t);
        lg.gain.setValueAtTime(0, t + inst.vib[2]);
        lg.gain.linearRampToValueAtTime(inst.vib[1], t + inst.vib[2] + 0.3);
        lfo.connect(lg);
        for (const o of oscs) lg.connect(o.detune);
        lfo.start(t); lfo.stop(stop);
      }
      if (inst.thump) this.noise(dest, { d: 0.005, r: 0.05, vol: inst.thump * vel, lp: 700 }, t);
      for (const o of oscs) { o.start(t); o.stop(stop + 0.01); }
      oscs[0].onended = () => g.disconnect();
      return stop;
    }
  }

  // drum kit: (mixer, dest, time, velocity) → schedules the hit
  const DRUMS = {
    k(m, d, t, v) { m.tone(d, { w: 'sine', f: 150, f2: 44, sd: 0.11, d: 0.03, r: 0.26, vol: 0.66 * v }, t); m.noise(d, { d: 0.003, r: 0.012, vol: 0.15 * v, lp: 2800 }, t); },
    s(m, d, t, v) { m.noise(d, { d: 0.01, r: 0.15, vol: 0.26 * v, hp: 1100, lp: 8500 }, t); m.tone(d, { w: 'triangle', f: 205, f2: 150, sd: 0.05, d: 0.02, r: 0.07, vol: 0.33 * v }, t); },
    h(m, d, t, v) { m.noise(d, { d: 0.004, r: 0.04, vol: 0.13 * v, hp: 7500 }, t); },
    o(m, d, t, v) { m.noise(d, { d: 0.05, r: 0.24, vol: 0.12 * v, hp: 6500 }, t); },
    c(m, d, t, v) { m.noise(d, { d: 0.03, r: 1.4, vol: 0.2 * v, hp: 3200 }, t); m.noise(d, { d: 0.02, r: 0.5, vol: 0.12 * v, bp: 7500, q: 0.8 }, t); },
    t(m, d, t, v) { m.tone(d, { w: 'sine', f: 230, f2: 175, sd: 0.2, d: 0.02, r: 0.3, vol: 0.48 * v }, t); m.noise(d, { d: 0.004, r: 0.03, vol: 0.15 * v, lp: 1800 }, t); },
    m(m, d, t, v) { m.tone(d, { w: 'sine', f: 170, f2: 128, sd: 0.2, d: 0.02, r: 0.34, vol: 0.5 * v }, t); m.noise(d, { d: 0.004, r: 0.03, vol: 0.15 * v, lp: 1500 }, t); },
    f(m, d, t, v) { m.tone(d, { w: 'sine', f: 120, f2: 88, sd: 0.25, d: 0.02, r: 0.4, vol: 0.53 * v }, t); m.noise(d, { d: 0.004, r: 0.04, vol: 0.15 * v, lp: 1200 }, t); },
    x(m, d, t, v) { m.tone(d, { w: 'triangle', f: 1750, d: 0.003, r: 0.025, vol: 0.28 * v }, t); m.noise(d, { d: 0.003, r: 0.02, vol: 0.2 * v, bp: 2600, q: 2 }, t); },
    z(m, d, t, v) { m.noise(d, { a: 0.012, d: 0.015, r: 0.05, vol: 0.13 * v, bp: 6500, q: 1.2 }, t); },
    p(m, d, t, v) { for (let k = 0; k < 3; k++) m.noise(d, { t: k * 0.011, d: 0.003, r: 0.012, vol: 0.3 * v, bp: 1300, q: 1.4 }, t); m.noise(d, { t: 0.033, d: 0.004, r: 0.13, vol: 0.28 * v, bp: 1200, q: 1.2 }, t); },
    b(m, d, t, v) { m.tone(d, { w: 'sine', f: 78, f2: 46, sd: 0.3, d: 0.03, r: 0.9, vol: 0.7 * v }, t); m.noise(d, { d: 0.01, r: 0.35, vol: 0.28 * v, lp: 320 }, t); },
    g(m, d, t, v) { m.fm(d, { f: 88, ratio: 1.41, index: 3, md: 1.2, d: 0.05, r: 2.6, vol: 0.32 * v }, t); m.noise(d, { d: 0.05, r: 1.6, vol: 0.1 * v, bp: 900, q: 0.7 }, t); },
    w(m, d, t, v) { m.tone(d, { w: 'sine', f: 1150, f2: 1000, sd: 0.04, d: 0.004, r: 0.06, vol: 0.4 * v }, t); m.tone(d, { w: 'sine', f: 1900, d: 0.002, r: 0.025, vol: 0.15 * v }, t); },
    i(m, d, t, v) { m.tone(d, { w: 'sine', f: 4200, d: 0.004, r: 1.0, vol: 0.07 * v }, t); m.tone(d, { w: 'sine', f: 6150, d: 0.004, r: 0.6, vol: 0.04 * v }, t); },
  };

  // ============================================================ playback of one track
  class Playback {
    constructor(mx, song, o) {
      const c = mx.ctx;
      this.mx = mx; this.song = song; this.id = song.id; this.serial = ++Playback.count;
      this.loop = song.loop && o.loop !== false;
      this.passes = o.passes || Infinity;
      this.pass = 1;
      this.offset = 0;
      this.stopped = false;
      const at = o.at, pos = Math.max(0, Math.min(o.pos || 0, song.endSec));
      this.t0 = at - pos;
      this.out = c.createGain();
      const G = this.out.gain;
      G.value = o.fadeIn ? 0 : song.gain; // also the value if stopped before `at`
      if (o.fadeIn) { G.setValueAtTime(0, at); G.linearRampToValueAtTime(song.gain, at + o.fadeIn); }
      else G.setValueAtTime(song.gain, at);
      this.out.connect(o.dest);
      this.echo = song.echo ? makeEcho(c, this.out, song.echo) : null;
      this.nodes = [this.out];
      this.chans = song.channels.map((ch) => {
        const g = c.createGain();
        g.gain.value = ch.vol;
        this.nodes.push(g);
        if (ch.pan && c.createStereoPanner) {
          const p = c.createStereoPanner();
          p.pan.value = ch.pan;
          g.connect(p); p.connect(this.out);
          this.nodes.push(p);
        } else g.connect(this.out);
        if (this.echo && ch.echo) {
          const s = c.createGain();
          s.gain.value = ch.echo;
          g.connect(s); s.connect(this.echo.input);
          this.nodes.push(s);
        }
        return g;
      });
      this.idx = lowerBound(song.events, pos);
      if (pos > 0.05) this.catchUp(pos, at);
    }
    /** re-sound notes that were still held at the resume position */
    catchUp(pos, at) {
      const ev = this.song.events;
      for (let k = 0; k < this.idx; k++) {
        const e = ev[k];
        const left = e.time + e.dur - pos;
        if (e.drum || left < 0.15) continue;
        this.play(e, at, left);
      }
    }
    play(e, t, dur) {
      if (this.only && !this.only.includes(e.ch)) return;
      const dest = this.chans[e.ch], vel = e.vel / 12, mx = this.mx;
      if (e.drum) { for (const k of e.notes) if (DRUMS[k]) DRUMS[k](mx, dest, t, vel); return; }
      const inst = INST[e.inst] || INST.pulse;
      for (const m of e.notes) mx.voice(inst, dest, m, t, dur != null ? dur : e.dur, vel);
    }
    schedule(until, now) {
      const S = this.song, ev = S.events;
      while (!this.stopped) {
        if (this.idx >= ev.length) {
          if (this.loop && this.pass < this.passes && S.endSec - S.loopSec > 0.1) {
            this.pass++;
            this.offset += S.endSec - S.loopSec;
            this.idx = S.loopIdx;
          } else { this.done = true; break; }
        }
        const e = ev[this.idx], t = this.t0 + this.offset + e.time;
        if (t >= until) break;
        this.idx++;
        if (t < now - 0.08) continue; // hopelessly late (tab stalled): skip
        this.play(e, Math.max(t, now));
      }
    }
    /** song-relative position (s) at context time `now` */
    position(now) {
      const S = this.song, raw = now - this.t0;
      if (raw < 0) return 0;
      if (!this.loop || raw < S.endSec) return Math.min(raw, S.endSec);
      const L = S.endSec - S.loopSec;
      return L > 0.1 ? S.loopSec + ((raw - S.loopSec) % L) : S.endSec;
    }
    /** context time at which the (non-looping) song ends */
    get endTime() { return this.t0 + this.song.endSec; }
    stop(fade) {
      if (this.stopped) return;
      this.stopped = true;
      const now = this.mx.ctx.currentTime, G = this.out.gain;
      fade = Math.max(0.02, fade || 0);
      holdParam(G, now);
      G.linearRampToValueAtTime(0, now + fade);
      if (this.mx.live) setTimeout(() => this.dispose(), (fade + 0.4) * 1000);
    }
    dispose() {
      for (const n of this.nodes) { try { n.disconnect(); } catch (e) { /* ignore */ } }
      if (this.echo) for (const n of this.echo.nodes) { try { n.disconnect(); } catch (e) { /* ignore */ } }
    }
  }

  Playback.count = 0;

  // ============================================================ recorded BGM (BRIEF A10)
  // assets/bgm/<id>.(ogg|mp3|m4a|wav) → tools/build.js lists it in window.RPG_MEDIA.bgm[id] =
  // {src, loopStart?, loopEnd?, gain?, loop?}. A FilePlayback has the Playback interface the
  // controller uses (id serial file position() endTime stop() schedule() dispose()), so push/pop,
  // jingles, fades, volume and ducking behave exactly as for a synthesised track.
  const FILE_GAIN = 0.7; // mastered files are far louder than the synth tracks (gain ≈ 0.8–1 on −18 LUFS)
  class FilePlayback {
    constructor(mx, id, buf, meta, o) {
      const c = mx.ctx;
      meta = meta || {};
      this.mx = mx; this.id = id; this.file = true; this.serial = ++Playback.count; this.stopped = false;
      const dur = buf.duration;
      let ls = Math.max(0, +meta.loopStart || 0), le = +meta.loopEnd || dur;
      if (!(le <= dur)) le = dur;
      if (!(le > ls + 0.1)) { ls = 0; le = dur; }
      this.dur = dur; this.loopStart = ls; this.loopEnd = le;
      this.loop = meta.loop !== false && o.loop !== false;
      let pos = Math.max(0, o.pos || 0);
      if (this.loop && pos >= le) pos = ls + ((pos - ls) % (le - ls));
      if (!this.loop) pos = Math.min(pos, dur);
      const at = o.at, gain = meta.gain != null ? +meta.gain : FILE_GAIN;
      this.t0 = at - pos;
      this.out = c.createGain();
      const G = this.out.gain;
      G.value = o.fadeIn ? 0 : gain;
      if (o.fadeIn) { G.setValueAtTime(0, at); G.linearRampToValueAtTime(gain, at + o.fadeIn); }
      else G.setValueAtTime(gain, at);
      this.out.connect(o.dest);
      const s = (this.src = c.createBufferSource());
      s.buffer = buf;
      s.loop = this.loop;
      if (this.loop) { s.loopStart = ls; s.loopEnd = le; }
      s.connect(this.out);
      s.start(at, pos);
      this.nodes = [s, this.out];
    }
    schedule() { /* the buffer source plays by itself */ }
    position(now) {
      const raw = now - this.t0;
      if (raw < 0) return 0;
      if (!this.loop) return Math.min(raw, this.dur);
      if (raw < this.loopEnd) return raw;
      return this.loopStart + ((raw - this.loopStart) % (this.loopEnd - this.loopStart));
    }
    get endTime() { return this.t0 + this.dur; }
    stop(fade) {
      if (this.stopped) return;
      this.stopped = true;
      const now = this.mx.ctx.currentTime, G = this.out.gain;
      fade = Math.max(0.02, fade || 0);
      holdParam(G, now);
      G.linearRampToValueAtTime(0, now + fade);
      try { this.src.stop(now + fade + 0.05); } catch (e) { /* not started yet */ }
      if (this.mx.live) setTimeout(() => this.dispose(), (fade + 0.4) * 1000);
    }
    dispose() { for (const n of this.nodes) { try { n.disconnect(); } catch (e) { /* ignore */ } } }
  }

  // ============================================================ SFX kit
  // R.DB.sfx.id = function (S) { S.tone({...}); S.noise({...}); } — times in seconds from now.
  class Kit {
    constructor(mx, out, send, t0) { this.mx = mx; this.out = out; this.send = send; this.t0 = t0; this.end = t0; }
    _e(x) { if (x > this.end) this.end = x; return this; }
    tone(o) { return this._e(this.mx.tone(this.out, o, this.t0)); }
    noise(o) { return this._e(this.mx.noise(this.out, o, this.t0)); }
    fm(o) { return this._e(this.mx.fm(this.out, o, this.t0)); }
    /** notes (midi, null = skip) one after another every `step` seconds */
    seq(notes, step, o) {
      o = o || {};
      notes.forEach((n, i) => { if (n != null) this.tone(Object.assign({ d: step }, o, { n, t: (o.t || 0) + i * step })); });
      return this;
    }
    /** same as seq but with FM bells */
    bells(notes, step, o) {
      o = o || {};
      notes.forEach((n, i) => { if (n != null) this.fm(Object.assign({ d: step }, o, { n, t: (o.t || 0) + i * step })); });
      return this;
    }

  };
  X.roar = (S) => {

  const GAIN = {
    cursor: 1.95, confirm: 1.8, cancel: 1.78, menu_open: 1.38, attack: 1.8, hit: 0.68, crit: 0.54,
    miss: 1.64, enemy_attack: 1.46, hurt: 0.76, magic: 1.51, fire: 0.9, ice: 1.41, wind: 1.7,

try{
// Sound effects new in ルミナス・クロニクル (DESIGN §11.10.5, §11.11.4): glimmer golden light

// impacts ≈ -3. Each def ends with its own S.gain() (sfx.js's GAIN table is private).
(function (R) {
  'use strict';
  const X = {};

  // 閃き「ピコーン」— a short bright pulse (ピ, D6) and an FM bell an octave up that rings on

  // 6 dB for a third of a second under it so the ring always cuts through the battle BGM.
  X.glimmer = (S) => {
    S.duck(-6, 0.32);
    S.tone({ w: 'p25', n: 86, d: 0.03, r: 0.015, vol: 0.12, lp: 7500 });                          // ピ

  X.swap = (S) => {
    S.tone({ w: 'p25', n: 84, d: 0.03, r: 0.02, vol: 0.1, lp: 6000 });

    [0, 0.3].forEach((t, i) => {

      S.tone({ w: 'sine', n: 105 - i * 2, t, a: 0.002, d: 0.01, r: 0.5, vol: 0.03 });

    S.gain(1.95);

  X.unlock = (S) => {
    S.noise({ a: 0.03, d: 0.2, r: 0.25, vol: 0.45, lp: 280, rate: 0.5 });
    S.tone({ w: 'sine', f: 62, f2: 40, sd: 0.4, a: 0.02, d: 0.2, r: 0.2, vol: 0.4 });

    S.gain(0.7);

    S.noise({ t: 0.04, a: 0.03, d: 0.05, r: 0.03, vol: 0.2, bp: 1800, bp2: 6000, fd: 0.08, q: 1.4 }); // 風を切る
    S.noise({ t: 0.15, d: 0.01, r: 0.07, vol: 0.4, lp: 1500 });                                     // 刺さる

    S.noise({ t: 0.14, d: 0.003, r: 0.03, vol: 0.55, hp: 1800 });                                   // 破裂
    S.tone({ w: 'p50', f: 1400, f2: 500, sd: 0.02, t: 0.14, d: 0.004, r: 0.02, vol: 0.12 });

    S.noise({ d: 0.004, r: 0.02, vol: 0.4, hp: 3500 });

    S.fm({ n: 98, t: 0.004, ratio: 2.76, index: 1.6, md: 0.08, d: 0.005, r: 0.3, vol: 0.08 });
    S.tone({ w: 'sine', n: 103, a: 0.002, d: 0.01, r: 0.25, vol: 0.03, vib: [30, 20] });

  X.secret = (S) => {

    [[74, 0.12], [78, 0.2], [85, 0.28]].forEach(([n, t]) => S.tone({ w: 'triangle', n, t, a: 0.01, d: 0.06, r: 0.18, vol: 0.12, vib: [9, 18] }));
    S.tone({ w: 'p25', n: 85, n2: 97, sd: 0.25, t: 0.3, a: 0.02, d: 0.2, r: 0.2, vol: 0.035, lp: 6000, vib: [6, 30] });

// ==== src/audio/sfx_v2.js
try{
// v2 の新しい効果音・ジングルの id（CORE、V2_PLAN §3.10）。P0 では今の音への付け替え。
// P1 で CORE が専用の音を作ったら、ここの付け替えを本物の定義に差し替える（id は変えない）。
//   効果音: spring（泉）・lead（手がかり帳に書いた）・lamp（灯籠がともる）・telegraph（ボスの予告）・bridge（つり橋）
//   ジングル: grow（HP/MP の伸び。今の levelup を使う、A30）
(function (R) {
  'use strict';
  const ALIAS_SFX = { spring: 'heal', lead: 'quill', lamp: 'light', telegraph: 'status', bridge: 'step_damage' };
  const ALIAS_MUSIC = { grow: 'levelup' };
  R.onData(function () {
    for (const id of Object.keys(ALIAS_SFX)) {
      if (R.DB.sfx[id]) continue;
      const to = ALIAS_SFX[id];
      R.DB.sfx[id] = function (S) { const f = R.DB.sfx[to] || R.DB.sfx.confirm; if (f) f(S); };
    }
    for (const id of Object.keys(ALIAS_MUSIC)) {
      if (!R.DB.music[id] && R.DB.music[ALIAS_MUSIC[id]]) R.DB.music[id] = R.DB.music[ALIAS_MUSIC[id]];
    }
  });
})(window.RPG);

}catch(e){(window.RPG=window.RPG||{}).loadErrors=(window.RPG.loadErrors||[]);window.RPG.loadErrors.push("src/audio/sfx_v2.js"+': '+(e&&e.stack||e));console.error("src/audio/sfx_v2.js",e);}
// ==== src/main.js
try{
// 起動（CORE）: 全ファイルを読んだ後に 1 回。仮の実装の穴埋め → データの後処理 → 起動の仕事 → タイトル
// R.Flow: タイトル → 新しいゲーム／つづき の流れ（タイトルの画面は MENUS、始まりの場所は R.DB.config.start）
(function (R) {
  'use strict';

  const Flow = (R.Flow = {
    /** 全部の場面を閉じてタイトルへ */
    async title() {
      R.Engine.clear();
      R.Engine.fade.a = 0;
      R.Game = null;
      R.Input.touchLayout('menu');
      R.Audio.bgm('title', { fade: 600 });
      const r = await R.Screens.open('title');
      if (r && r.cmd === 'continue' && R.Save.load(r.slot)) return Flow.resume();
      if (r && r.cmd === 'load') return Flow.resume();
      return Flow.newGame(r || {});
    },
    /** 新しいゲーム。R.DB.config.start = {map, spawn, event?} */
    async newGame(o) {
      o = o || {};
      const s = (R.DB.config && R.DB.config.start) || {};
      const hero = o.hero || (s.event ? null : await R.Screens.open('charcreate'));
      R.State.newGame({ hero, seed: o.seed });
      await R.Field.enter(s.map, s.spawn, { fade: 0, noAutosave: true });
      if (s.event) await R.Events.run(s.event, { map: s.map });
    },
    /** 読み込んだ R.Game の場所から続ける */
    async resume() {
      const p = R.Game.pos || {};
      await R.Field.enter(p.map, { x: p.x, y: p.y, dir: p.dir }, { fade: 260, noAutosave: true });
    },
    /**
     * 全滅して「宿から」「タイトルへ」を選んだ後の共通の片付け（契約の版 2、§2.5.3）。
     * 呼ぶのは BSCENE だけ: 戦闘の場面を外した後、R.Battle.start の Promise を {result:'abort', to} で解決する**前**に await する。
     *   'inn'  : 走っているイベントを R.Events.abort()（ev.battle はその後の guard で止まる）→ 開いた画面・会話を閉じる →
     *            R.Game.lastInn（{map,x,y,dir}）→ 無ければ lastTown → 無ければ R.DB.config.start へ R.Field.enter
     *            （所持金半分と全快 = R.State.wipeRecover() は BSCENE が先に呼ぶ）
     *   'title': R.Events.abort() → R.Flow.title()（await しない。タイトルの画面が開いたら戻る）
     * FIELD（歩いて出た戦闘）と EVENTS（ev.battle）は 'abort' を受けても何もしなくてよい。
     */
    async wipe(to) {
      if (R.Events && R.Events.busy && R.Events.busy()) R.Events.abort();
      if (to === 'title') { Flow.title(); return; }
      // フィールドより上に積まれた物（メニュー・会話）を閉じる
      const st = R.Engine.stack;
      for (let i = st.length - 1; i >= 0; i--) { if (st[i].id === 'field') break; R.Engine.remove(st[i]); }
      if (R.UIK && R.UIK.Message && R.UIK.Message.busy()) R.UIK.Message.close();
      const G = R.Game || {};
      const s = (R.DB.config && R.DB.config.start) || {};
      const p = G.lastInn || G.lastTown || null;
      if (p && p.map) await R.Field.enter(p.map, p.x != null ? { x: p.x, y: p.y, dir: p.dir || 's' } : p.spawn, { fade: 260, noAutosave: true });
      else await R.Field.enter(s.map, s.spawn, { fade: 260, noAutosave: true });
    },
  });

  function waitFonts() {
    if (typeof document === 'undefined' || !document.fonts || !document.fonts.load) return Promise.resolve();
    const loads = ['500 16px "Zen Maru Gothic"', '700 16px "Zen Maru Gothic"', '400 16px "Cinzel"', '700 16px "Cinzel"']
      .map((f) => document.fonts.load(f, 'あ灯A').catch(() => null));
    // 起動の待ちだけは実時間で数える（Engine はまだ回っていない）
    return Promise.race([Promise.all(loads), new Promise((res) => setTimeout(res, 2500))]);
  }

  R.boot = async function () {
    if (R._booted) return;
    R._booted = true;
    const canvas = document.getElementById('screen');
    R.Stubs.install();
    R.runDataHooks();
    R.Settings.load();
    R.Gfx.init(canvas);
    R.fit(true);
    window.addEventListener('resize', () => R.fit());
    window.addEventListener('orientationchange', () => R.fit());
    R.Input.init(canvas);
    R.Input.onAnyPress(() => { try { R.Audio.init(); } catch (e) { console.error(e); } });
    await waitFonts();
    R.Engine.addTick((dt, real) => { if (R.Game && R.Engine.has('field')) R.Game.playMs = (R.Game.playMs || 0) + real; });
    // 焼く列（版 2）: 毎フレーム R.Hd.pump(予算 3 ms) を CORE が 1 回だけ呼ぶ。ほかの担当は pump を呼ばない（暗転中の同期の焼きは R.Hd.now）
    R.Engine.addTick(() => { if (R.Hd && R.Hd.pump) R.Hd.pump((R.Hd.BUDGET && R.Hd.BUDGET.frameBakeMs) || 3); });
    for (const fn of R._bootHooks) { try { await fn(); } catch (e) { console.error('boot hook failed', e); } }
    R.Engine.start(canvas);
    if (R.loadErrors.length) console.error('LOAD ERRORS:\n' + R.loadErrors.join('\n'));
    R.emit('booted');
    if (R.devBoot && (await R.devBoot())) return; // dev.html だけ: ?fixture= / ?scene=（src/dev/fixtures.js）
    Flow.title();
  };

  if (typeof document !== 'undefined' && document.getElementById) {
    if (document.readyState === 'complete') R.boot();
    else window.addEventListener('load', () => R.boot());
  }
})(window.RPG);

}catch(e){(window.RPG=window.RPG||{}).loadErrors=(window.RPG.loadErrors||[]);window.RPG.loadErrors.push("src/main.js"+': '+(e&&e.stack||e));console.error("src/main.js",e);}
</script>
