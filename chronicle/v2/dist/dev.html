    },
    menu() {
      const cmds = ['items', 'skills', 'equip', 'order', 'bestiary', 'chronicle', 'map', 'save', 'settings'];
      return listScene('menu', {
        rows: cmds.map((c) => ({ label: NAMES[c], value: c })),
        onSelect(row) { R.Screens.open(row.value); },
        onCancel(sc) { R.Engine.remove(sc); },
        side(g) {
          const K = k(), mem = R.Party.members();
          const tall = R.layout === 'tall';
          const w = (tall ? 300 : 300) * K, x = tall ? R.safe.l + 24 * K : R.W - R.safe.r - w - 24 * K;
          const y0 = tall ? R.safe.t + 24 * K + (cmds.length * 38 + 64) * K + 16 * K : R.safe.t + 24 * K;
          mem.forEach((c, i) => {
            const y = y0 + i * 76 * K, mh = R.Growth.baseMax(c, 'hp'), mm = R.Growth.baseMax(c, 'mp');
            R.UIK.card(g, { x, y, w, h: 68 * K }, {});
            R.UIK.portraitFrame(g, { x: x + 6 * K, y: y + 6 * K, w: 56 * K, h: 56 * K }, c.look, {});
            R.UIK.text(g, c.name, x + 72 * K, y + 8 * K, { size: 16 * K, weight: 700 });
            R.UIK.text(g, `HP ${c.hp}/${mh}   MP ${c.mp}/${mm}`, x + 72 * K, y + 34 * K, { size: 13 * K, color: T().color.text2 });
          });
          R.UIK.text(g, `${R.Game.gold} G   ${R.U.playTime(R.Game.playMs)}`, x, y0 + mem.length * 76 * K + 6 * K, { size: 13 * K, color: T().color.gold });
        },
      });
    },
    save() {
      const slots = ['s1', 's2', 's3'];
      const rows = () => slots.map((s, i) => ({ label: `記録 ${i + 1}   ` + cardText((R.Save.cards().find((e) => e.slot === s) || {}).card), value: s }));
      return listScene('save', {
        rows: rows(), w: 620,
        onSelect(row, i, sc) {
          if (R.Save.save(row.value)) R.UIK.toast('セーブしました', { anchor: 'bl' });
          sc.list.rows = rows();
        },
        onCancel(sc) { R.Engine.remove(sc); },
      });
    },
    load() {
      const rows = R.Save.cards().map((e) => ({ label: `${e.slot}   ${cardText(e.card)}`, value: e.slot, disabled: !e.card || !!e.card.bad }));
      return listScene('load', {
        rows, w: 620,
        onSelect(row, i, sc) { R.Engine.remove(sc, R.Save.load(row.value) ? { slot: row.value } : null); },
        onCancel(sc) { R.Engine.remove(sc, null); },
      });
    },
  };

  function generic(id, params) {
    return listScene(id, {
      rows: [{ label: `（仮）${NAMES[id] || id}の画面`, value: 0 }],
      w: 360,
      onSelect(row, i, sc) { R.Engine.remove(sc); },
      onCancel(sc) { R.Engine.remove(sc); },
    });
  }

  R.Stubs.define('Screens', {
    open(id, params) {
      if (id === 'tip' || id === 'detail') return Promise.resolve();
      const make = OPEN[id] || ((p) => generic(id, p));
      const prev = R.Input.layoutName;
      return R.Engine.await(make(params || {}), params).then((r) => { R.Input.touchLayout(prev); return r; });
    },
    tip() { return Promise.resolve(); },
    detail() { return Promise.resolve(); },
  });
})(window.RPG);

<script>
// 仮の実装: UIK（R.UIK）。本物は src/uik/*（UIK）。V2_PLAN §2.5.6、MODERN_UI §3
// 窓は紺の半透明の角丸、文字は素の Zen Maru Gothic。Message（会話）は場面として積む。
(function (R) {
  'use strict';
  const T = {
    color: {
      text: '#f6f0e3', text2: '#d2c9b6', text3: '#9a917f', disabled: '#6c675f',
      panel: 'rgba(14,16,28,0.72)', panelDense: 'rgba(14,16,28,0.9)', edge: 'rgba(240,228,200,0.14)',
      gold: '#ecc97c', goldHi: '#fff1c8', goldLo: '#b98f47', teal: '#8fd6d8',
      hp: ['#5f9e5a', '#a9dc8e'], mp: ['#3d6aa6', '#92bdf0'], up: '#8ee08a', down: '#f47e6c', same: '#8e8878',
      rare: '#86c8ff', superRare: '#ffb65e', front: '#f2c28a', back: '#a9d2f2',
    },
    size: { display: 44, h1: 30, h2: 20, title: 16.5, body: 15, talk: 16.5, label: 13, caption: 11.5, micro: 10 },
    radius: 12,
    pad: 16,
    ms: { cursor: 80, focus: 120, open: 180, close: 140, screen: 260, place: 2400, toast: 2400 },
  };
  const u = () => R.uiScale || 1;

  // ---------------------------------------------------------------- 通知（toast）
  const toasts = [];
  function drawToasts(g) {
    const now = R.Engine.time;
    for (let i = toasts.length - 1; i >= 0; i--) if (now - toasts[i].t0 > toasts[i].ms) toasts.splice(i, 1);
    let y = R.H - (R.safe.b || 0) - 20 * u();
    for (const t of toasts) {
      const k = Math.min(1, (now - t.t0) / 180, (t.ms - (now - t.t0)) / 300);
      const w = R.UIK.measure(t.text, { size: T.size.label * u() }) + 36 * u(), h = 30 * u();
      const x = t.anchor === 'bl' ? (R.safe.l || 0) + 16 * u() : R.W - (R.safe.r || 0) - 16 * u() - w;
      y -= h;
      g.save();
      g.globalAlpha = Math.max(0, k);
      R.UIK.panel(g, { x, y, w, h }, { r: 8 });
      R.Gfx.circle(x + 14 * u(), y + h / 2, 4 * u(), T.color.gold);
      R.UIK.text(g, t.text, x + 26 * u(), y + h / 2 - T.size.label * u() * 0.62, { size: T.size.label * u() });
      g.restore();
      y -= 8 * u();
    }
  }

  // ---------------------------------------------------------------- List
  class List {
    constructor(o) {
      Object.assign(this, { rows: [], rowH: 34, cols: 1, index: 0, top: 0 }, o);
    }
    get visible() { return Math.max(1, Math.floor((this.rect ? this.rect.h : 300) / (this.rowH * u()))); }
    update() {
      const I = R.Input, n = this.rows.length;
      if (!n) { if (I.pressed('b') && this.onCancel) this.onCancel(); return; }
      if (I.repeat('down')) this.index = (this.index + 1) % n;
      if (I.repeat('up')) this.index = (this.index + n - 1) % n;
      const p = I.pointer;
      if (this.rect && (p.pressed || p.wheel)) {
        const r = this.rect, rh = this.rowH * u();
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
          const i = this.top + Math.floor((p.y - r.y) / rh);
          if (p.pressed && i >= 0 && i < n) { this.index = i; if (this.onSelect) this.onSelect(this.rows[i], i); return; }
        }
      }
      if (this.index < this.top) this.top = this.index;
      if (this.index >= this.top + this.visible) this.top = this.index - this.visible + 1;
      if (I.pressed('a') && this.onSelect) this.onSelect(this.rows[this.index], this.index);
      else if (I.pressed('b') && this.onCancel) this.onCancel();
    }
    draw(g, rect) {
      this.rect = rect;
      const rh = this.rowH * u();
      const end = Math.min(this.rows.length, this.top + this.visible);
      for (let i = this.top; i < end; i++) {
        const rr = { x: rect.x, y: rect.y + (i - this.top) * rh, w: rect.w, h: rh };
        const f = i === this.index;
        if (f) R.UIK.focus(g, rr, R.Engine.time);
        if (this.render) this.render(g, this.rows[i], rr, f);
        else R.UIK.text(g, String(this.rows[i].label || this.rows[i]), rr.x + 16 * u(), rr.y + (rh - T.size.body * u()) / 2 - 1, { size: T.size.body * u(), weight: f ? 700 : 500, color: this.rows[i].disabled ? T.color.disabled : T.color.text });
      }
    }
  }
  class Layer {
    constructor(o) { Object.assign(this, { anchor: 'c' }, o); }
  }

  // ---------------------------------------------------------------- Message（会話）
  const SPEED = { slow: 30, normal: 60, fast: 120, instant: 1e9 }; // 字/秒
  let cur = null; // {scene, resolve}
  function msgScene(o) {
    const pages = Array.isArray(o.text) ? o.text.slice() : [String(o.text == null ? '' : o.text)];
    const st = { page: 0, shown: 0, choice: 0 };
    const hasChoices = Array.isArray(o.choices) && o.choices.length > 0;
    const scene = {
      id: 'message',
      opaque: false,
      enter() { if (o.voice && R.Audio && R.Audio.voice) R.Audio.voice(o.voice); },
      exit() {},
      full() { return st.shown >= [...pages[st.page]].length; },
      update(dt) {
        const I = R.Input;
        const len = [...pages[st.page]].length;
        st.shown = Math.min(len, st.shown + (SPEED[R.Settings.get('textSpeed')] || 60) * dt / 1000 * (I.down('r') ? 4 : 1));
        const last = st.page === pages.length - 1;
        if (last && hasChoices && scene.full()) {
          if (I.repeat('down')) st.choice = (st.choice + 1) % o.choices.length;
          if (I.repeat('up')) st.choice = (st.choice + o.choices.length - 1) % o.choices.length;
          if (I.pressed('a') || I.pointer.pressed) return finish(st.choice);
          if (I.pressed('b') && o.cancel != null) return finish(o.cancel);
          return;
        }
        if (I.pressed('a') || I.pressed('b') || I.pressed('down') || I.pointer.pressed) {
          if (!scene.full()) { st.shown = len; return; }
          if (R.Audio && R.Audio.stopVoice) R.Audio.stopVoice();
          if (!last) { st.page++; st.shown = 0; return; }
          finish(undefined);
        }
      },
      draw(g) {
        const k = u(), pad = 20 * k;
        const w = Math.min(R.W - 32 * k, 860 * k), h = 128 * k;
        const x = (R.W - w) / 2, y = R.H - (R.safe.b || 0) - h - 16 * k;
        R.UIK.panel(g, { x, y, w, h }, {});
        let tx = x + pad;
        if (o.face) {
          R.UIK.portraitFrame(g, { x: x + 14 * k, y: y + 14 * k, w: 100 * k, h: 100 * k }, o.face, {});
          tx = x + 128 * k;
        }
        if (o.name) R.UIK.text(g, o.name + (o.title ? '  ' + o.title : ''), tx, y + 14 * k, { size: T.size.title * k, weight: 700, color: T.color.gold });
        const s = [...pages[st.page]].slice(0, Math.floor(st.shown)).join('');
        const lines = s.split('\n');
        lines.forEach((l, i) => R.UIK.text(g, l, tx, y + (o.name ? 42 : 20) * k + i * 28 * k, { size: T.size.talk * k }));
        if (hasChoices && st.page === pages.length - 1 && scene.full()) {
          const cw = 220 * k, ch = o.choices.length * 34 * k + 16 * k;
          const cx = x + w - cw, cy = y - ch - 8 * k;
          R.UIK.panel(g, { x: cx, y: cy, w: cw, h: ch }, {});
          o.choices.forEach((c, i) => {
            const rr = { x: cx + 6 * k, y: cy + 8 * k + i * 34 * k, w: cw - 12 * k, h: 34 * k };
            if (i === st.choice) R.UIK.focus(g, rr, R.Engine.time);
            R.UIK.text(g, c, rr.x + 16 * k, rr.y + 8 * k, { size: T.size.body * k, weight: i === st.choice ? 700 : 500 });
          });
        } else if (scene.full()) {
          const b = 0.5 + 0.5 * Math.sin(R.Engine.time / 180);
          g.fillStyle = `rgba(236,201,124,${0.5 + b * 0.5})`;
          g.beginPath(); g.moveTo(x + w - 30 * k, y + h - 24 * k); g.lineTo(x + w - 18 * k, y + h - 24 * k); g.lineTo(x + w - 24 * k, y + h - 16 * k); g.fill();
        }
      },
    };
    function finish(v) {
      if (!cur || cur.scene !== scene) return;
      const c = cur; cur = null;
      R.Engine.remove(scene, v);
      c.resolve(v);
    }
    scene.finish = finish;
    return scene;
  }

  R.Stubs.define('UIK', {
    T,
    text(g, s, x, y, o) {
      o = o || {};
      if (o.shadow) { g.save(); g.shadowColor = 'rgba(0,0,10,0.8)'; g.shadowBlur = 4; }
      R.Gfx.text(s, x, y, { size: o.size || T.size.body, weight: o.weight || 500, color: o.color || T.color.text, align: o.align, family: o.family, baseline: o.baseline });
      if (o.shadow) g.restore();
    },
    measure(s, o) { o = o || {}; return R.Gfx.measure(s, { size: o.size || T.size.body, weight: o.weight || 500, family: o.family }); },
    fit(s, w, o) {
      s = String(s);
      if (R.UIK.measure(s, o) <= w) return s;
      const a = [...s];
      while (a.length && R.UIK.measure(a.join('') + '…', o) > w) a.pop();
      return a.join('') + '…';
    },
    panel(g, rect, o) {
      o = o || {};
      R.Gfx.roundRect(rect.x, rect.y, rect.w, rect.h, o.r != null ? o.r : T.radius, o.dense || R.Settings.get('panel') === 'dense' ? T.color.panelDense : T.color.panel, T.color.edge, 1);
    },
    fadePanel(g, rect, o) {
      const side = (o && o.side) || 'r';
      const gr = side === 'r' ? g.createLinearGradient(rect.x + rect.w, 0, rect.x, 0) : g.createLinearGradient(rect.x, 0, rect.x + rect.w, 0);
      gr.addColorStop(0, 'rgba(14,16,28,0.78)'); gr.addColorStop(1, 'rgba(14,16,28,0)');
      g.fillStyle = gr; g.fillRect(rect.x, rect.y, rect.w, rect.h);
    },
    card(g, rect, o) {
      o = o || {};
      R.Gfx.roundRect(rect.x, rect.y, rect.w, rect.h, 8, T.color.panel, o.focused ? T.color.gold : T.color.edge, o.focused ? 1.5 : 1);
    },
    chip(g, x, y, text, o) {
      o = o || {};
      const s = (o.size || T.size.micro) * u(), w = R.UIK.measure(text, { size: s, weight: 700 }) + 14 * u();
      R.Gfx.roundRect(x, y, w, s + 8 * u(), (s + 8 * u()) / 2, o.bg || 'rgba(236,201,124,0.18)', o.color || T.color.gold, 1);
      R.UIK.text(g, text, x + 7 * u(), y + 3 * u(), { size: s, weight: 700, color: o.color || T.color.gold });
      return w;
    },
    toast(text, o) {
      o = o || {};
      toasts.push({ text: String(text), icon: o.icon, t0: R.Engine.time, ms: o.ms || T.ms.toast, anchor: o.anchor || 'bl' });
      if (toasts.length > 4) toasts.shift();
      if (R.Engine.overlay) R.Engine.overlay('toast', drawToasts, 50);
    },
    bubble(g, x, y, prompts) {
      const txt = (prompts || []).map((p) => `[${R.Input.prompt(p.btn).label}] ${p.label}`).join('  ');
      const s = T.size.label * u(), w = R.UIK.measure(txt, { size: s }) + 20 * u();
      R.Gfx.roundRect(Math.round(x - w / 2), y - s - 16 * u(), w, s + 12 * u(), 8, 'rgba(14,16,28,0.82)', T.color.edge, 1);
      R.UIK.text(g, txt, x, y - s - 10 * u(), { size: s, align: 'center' });
    },
    focus(g, rect, t) {
      const gr = g.createLinearGradient(rect.x, 0, rect.x + rect.w, 0);
      gr.addColorStop(0, 'rgba(236,201,124,0.28)'); gr.addColorStop(1, 'rgba(236,201,124,0.02)');
      g.fillStyle = gr; g.fillRect(rect.x, rect.y, rect.w, rect.h);
      g.fillStyle = T.color.gold; g.fillRect(rect.x, rect.y, 2, rect.h);
      const cy = rect.y + rect.h / 2, cx = rect.x + 8;
      g.beginPath(); g.moveTo(cx, cy - 4); g.lineTo(cx + 4, cy); g.lineTo(cx, cy + 4); g.lineTo(cx - 4, cy); g.fill();
    },
    gauge(g, rect, cur, max, kind) {
      const k = max > 0 ? Math.max(0, Math.min(1, cur / max)) : 0;
      g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(rect.x, rect.y, rect.w, rect.h);
      const c = kind === 'mp' ? T.color.mp : T.color.hp;
      const gr = g.createLinearGradient(rect.x, 0, rect.x + rect.w, 0); gr.addColorStop(0, c[0]); gr.addColorStop(1, c[1]);
      g.fillStyle = kind === 'hp' && k < 0.25 ? '#e0664f' : kind === 'hp' && k < 0.5 ? T.color.gold : gr;
      g.fillRect(rect.x, rect.y, rect.w * k, rect.h);
    },
    icon(g, name, x, y, size, color) { R.Gfx.roundRect(x, y, size, size, size / 4, null, color || T.color.text2, 1.5); },
    stars(g, grade, x, y) { R.UIK.text(g, grade === 'super' ? '★★' : grade === 'rare' ? '★' : '', x, y, { size: T.size.label, color: grade === 'super' ? T.color.superRare : T.color.rare }); },
    snapshot() { return null; },
    List,
    Layer,
    Message: {},
    prompts(g, list, anchor) {
      const k = u(), s = T.size.caption * k;
      let x = R.W - (R.safe.r || 0) - 16 * k;
      const y = R.H - (R.safe.b || 0) - 16 * k - s;
      for (const p of (list || []).slice().reverse()) {
        const pr = R.Input.prompt(p.btn);
        const lw = R.UIK.measure(p.label, { size: s });
        x -= lw;
        R.UIK.text(g, p.label, x, y, { size: s, color: T.color.text2 });
        const kw = Math.max(s + 8 * k, R.UIK.measure(pr.label, { size: s, weight: 700 }) + 10 * k);
        x -= kw + 6 * k;
        R.Gfx.roundRect(x, y - 3 * k, kw, s + 6 * k, pr.kind === 'pad' ? (s + 6 * k) / 2 : 4, 'rgba(246,240,227,0.9)', null);
        R.UIK.text(g, pr.label, x + kw / 2, y, { size: s, weight: 700, color: '#1a1a28', align: 'center' });
        x -= 16 * k;
      }
    },
    portraitFrame(g, rect, key, o) {
      R.Gfx.roundRect(rect.x, rect.y, rect.w, rect.h, 10, 'rgba(30,32,52,0.9)', T.color.edge, 1);
      const p = R.Portrait.parse(String(key));
      R.Portrait.draw(g, p.look, rect, { expr: p.expr, dim: o && o.dim });
    },
  });

  R.Stubs.define('UIK.Message', {
    say(o) {
      o = o || {};
      if (cur) cur.scene.finish(undefined); // 前の say を先に解決する（A6 の固まりの原因）
      return new Promise((resolve) => {
        const scene = msgScene(o);
        cur = { scene, resolve };
        R.Engine.push(scene);
      });
    },
    busy() { return !!cur; },
    close() { if (cur) cur.scene.finish(undefined); },
  });
})(window.RPG);

<script>
// Jingles new in ルミナス・クロニクル (DESIGN §11.10.5): superrare chapter recruit.
// One-shot fanfares (jingle:true): a jingle ends with its hand-written parts; arranged parts
// are cut there. Original; format documented at the top of src/core/audio.js.
(function (R) {
  'use strict';
  const M = {};

  // superrare — a one-of-a-kind item (drop / steal / chest). A major, ♩=144, ≈3.3 s: the
  // trumpet leaps up the triad to the high A while the glockenspiel throws sparks, horns and
  // choir swell underneath, and it lands broad on the tonic with a bell. Grander than `rare`.
  M.superrare = {
    jingle: true, tempo: 144, key: 'A', gain: 0.75,
    echo: { time: 0.2, fb: 0.36, wet: 0.3, lp: 5000 },
    chords: 'A*2 D | E7sus4 E7 A*2 |',
    ch: [
      { inst: 'trumpet', vol: 1, pan: 0.05, echo: 0.3, mml: 'o4 q7 e8. a16 >c+8. e16 a4 f+4 | e8 a8 g+8 b8 q8 a2 |' },
      { inst: 'horn', harm: 0, oct: -1, min: 48, vol: 0.5, pan: -0.3, echo: 0.25 },
      { inst: 'glock', vol: 0.5, pan: 0.35, echo: 0.4, mml: 'o6 l32 e a >c+ e< r8 r4 r4 r4 | r2 l16 c+ e a >c+ e4< |' },
      { inst: 'bell', vol: 0.35, pan: -0.4, echo: 0.5, mml: 'o5 r1 | r2 a2 |' },
      { inst: 'choir', vol: 0.3, pan: 0.2, echo: 0.3, pat: 'C2 C2', range: [57, 74], voices: 3 },
      { inst: 'strings', vol: 0.42, pan: 0.3, echo: 0.25, q: 7, pat: 'l4 C C C C', range: [55, 74], voices: 3 },
      { inst: 'bass', vol: 0.75, q: 6, range: [36, 52], pat: 'l4 R R R R' },
      { inst: 'timp', vol: 0.55, mml: 'o2 a4 r4 a4 d4 | e4 e4 a2 |' },
      { inst: 'drums', vol: 0.5, echo: 0.15, mml: '{kc}4 r4 s8 s8 s4 | k8 s16 s16 s8 s8 {ic}2 |' },
    ],
  };

  // chapter — a chapter is written into the chronicle. E minor → G, 3/4, ♩=90, ≈4 s: the
  // celesta sings the first four notes of 「語り部の主題」 (E F# G B) over the harp's page turn,
  // then climbs a scale into G; bells answer, low strings hold it up.
  M.chapter = {
    jingle: true, tempo: 90, meter: '3/4', key: 'G', gain: 0.97,
    echo: { time: 0.3, fb: 0.42, wet: 0.36, lp: 5000 },
    chords: 'Em | C D G |',
    ch: [
      { inst: 'celesta', vol: 1, pan: 0.1, echo: 0.45, mml: 'o5 q8 e4. f+8 g8 b8 | >c8 d8 e8 f+8 g4< |' },
      { inst: 'bell', vol: 0.45, pan: -0.3, echo: 0.5, mml: 'o6 r4 r8 g8 r8 b8 | r4 r4 {g>d}4 |' },
      { inst: 'harp', vol: 0.5, pan: 0.35, echo: 0.4, range: [40, 55], pat: "l8 R F O T' F' O'" },
      { inst: 'strings', vol: 0.4, pan: -0.15, echo: 0.3, pat: 'C2.', range: [43, 60], voices: 3 },
      { inst: 'contra', vol: 0.7, range: [28, 43], pat: 'R2.' },
      { inst: 'drums', vol: 0.45, echo: 0.4, mml: 'r2. | r4 r4 i4 |' },
    ],
  };

  // Octave-neutral (every > has its <): the caller sets o5 / k±n before the macro.

    cursor: 1.95, confirm: 1.8, cancel: 1.78, menu_open: 1.38, attack: 1.8, hit: 0.68, crit: 0.54,
    miss: 1.64, enemy_attack: 1.46, hurt: 0.76, magic: 1.51, fire: 0.9, ice: 1.41, wind: 1.7,
    water: 1.51, buff: 1.48, debuff: 1.66, status: 1.72, poison: 1.32, sleep: 1.78, escape: 1.53,
    stairs: 1.2, door: 0.83, locked: 1.88, chest: 1.5, item: 2.07, gold: 1.66, bump: 1.26,
    teleport: 1.33, steal: 1.57, jump: 1.53,
  };
  for (const id in GAIN) {
    const fn = X[id], g = GAIN[id];
    X[id] = (S) => { S.gain(g); fn(S); };
  }

  Object.assign(R.DB.sfx, X);
})(window.RPG);

<script>
// Sound effects new in ルミナス・クロニクル (DESIGN §11.10.5, §11.11.4): glimmer golden light
// freeze burn quill page swap bell unlock arrow lash parry secret. Same kit as sfx.js:
//   S.tone S.noise S.fm S.seq S.bells S.drum S.inst S.wet S.gain S.duck (see src/core/audio.js)
// Loudness (peak, tools/render_audio.js render --sfx): UI ≈ -12 dBFS, spells ≈ -9…-6,
// impacts ≈ -3. Each def ends with its own S.gain() (sfx.js's GAIN table is private).
(function (R) {
  'use strict';
  const X = {};

  // 閃き「ピコーン」— a short bright pulse (ピ, D6) and an FM bell an octave up that rings on
  // (コーン, D7, octave-ratio so it rings pure), a breath of air, a long echo. The music dips
  // 6 dB for a third of a second under it so the ring always cuts through the battle BGM.
  X.glimmer = (S) => {
    S.duck(-6, 0.32);
    S.tone({ w: 'p25', n: 86, d: 0.03, r: 0.015, vol: 0.12, lp: 7500 });                          // ピ
    S.tone({ w: 'p12', n: 98, d: 0.012, r: 0.01, vol: 0.05, lp: 9000 });
    S.fm({ n: 98, t: 0.05, ratio: 2, index: 1.8, md: 0.3, d: 0.01, r: 1.0, vol: 0.13 });          // コーン
    S.tone({ w: 'triangle', n: 98, t: 0.05, a: 0.004, d: 0.06, r: 0.8, vol: 0.09, vib: [5.5, 9] });
    S.tone({ w: 'sine', n: 110, t: 0.05, a: 0.004, d: 0.02, r: 0.35, vol: 0.03 });
    S.noise({ t: 0.05, d: 0.02, r: 0.28, vol: 0.05, hp: 7500 });
    S.wet(0.45);
    S.gain(2.05);
  };

  // golden individual appears — five rising glockenspiel sparks, then a small jingle bell
  X.golden = (S) => {
    [83, 88, 92, 95, 100].forEach((n, i) => S.inst('glock', n, i * 0.055, 0.3, 0.9 + i * 0.04));
    for (let k = 0; k < 4; k++) S.fm({ n: 105 - (k % 2) * 2, t: 0.3 + k * 0.045, ratio: 1.41, index: 2.2, md: 0.06, d: 0.005, r: 0.12, vol: 0.05 });
    S.noise({ t: 0.05, a: 0.1, d: 0.2, r: 0.3, vol: 0.05, hp: 8000 });
    S.wet(0.45);
    S.gain(0.6);
  };

  // light spells — a quick triangle major-chord swell (brighter and shorter than holy) and a
  // spray of high bell grains
  X.light = (S) => {
    [84, 88, 91, 96].forEach((n, i) => S.tone({ w: 'triangle', n, t: i * 0.018, a: 0.04, d: 0.16, r: 0.25, vol: 0.1, vib: [7, 10] }));
    S.tone({ w: 'p25', n: 100, t: 0.03, a: 0.02, d: 0.08, r: 0.15, vol: 0.03, lp: 8000 });
    S.bells([100, 103, 96, 105, 103, 100], 0.035, { t: 0.06, ratio: 4, index: 1, md: 0.1, d: 0.005, r: 0.18, vol: 0.06 });
    S.noise({ a: 0.05, d: 0.12, r: 0.18, vol: 0.06, hp: 8000 });
    S.wet(0.5);
    S.gain(1.17);
  };

  // freeze (凍結 status, ice composites) — ice cracking: inharmonic FM snaps, a sharp "piki"
  // click, a thin shimmer settling down
  X.freeze = (S) => {
    S.noise({ d: 0.004, r: 0.02, vol: 0.4, bp: 6500, q: 3 });                                    // ピキッ
    S.noise({ t: 0.05, d: 0.003, r: 0.015, vol: 0.3, bp: 8000, q: 3 });
    [[100, 0], [95, 0.03], [102, 0.07], [98, 0.11]].forEach(([n, t]) => S.fm({ n, t, ratio: 5.07, index: 2.6, md: 0.05, d: 0.004, r: 0.2, vol: 0.08 }));
    S.tone({ w: 'sine', n: 93, n2: 81, sd: 0.4, t: 0.12, a: 0.01, d: 0.3, r: 0.15, vol: 0.05, vib: [11, 25] });
    S.noise({ t: 0.08, a: 0.05, d: 0.15, r: 0.25, vol: 0.08, hp: 7000 });
    S.tone({ w: 'triangle', f: 130, f2: 90, sd: 0.1, d: 0.02, r: 0.08, vol: 0.15 });
    S.wet(0.4);
    S.gain(1.95);
  };

  // burn (やけど status, fire composites) — a short flare of flame and a handful of crackles
  X.burn = (S) => {
    S.noise({ a: 0.02, d: 0.1, r: 0.2, vol: 0.45, lp: 800, lp2: 3400, fd: 0.14, rate: 0.7 });
    S.tone({ w: 'sawtooth', f: 90, f2: 200, sd: 0.15, d: 0.1, r: 0.12, vol: 0.12, lp: 900 });

    S.wet(0.2);
    S.gain(0.9);
  };

  // quill — a pen scratching across paper three times, then a small bell
  X.quill = (S) => {
    [[0, 3000, 4800], [0.13, 3600, 2600], [0.25, 2800, 5200]].forEach(([t, a, b]) =>
      S.noise({ t, a: 0.012, d: 0.06, r: 0.03, vol: 0.2, bp: a, bp2: b, fd: 0.07, q: 2.4 }));
    S.noise({ t: 0.26, d: 0.008, r: 0.02, vol: 0.12, hp: 6000 });
    S.fm({ n: 93, t: 0.4, ratio: 3.5, index: 1.3, md: 0.2, d: 0.01, r: 0.5, vol: 0.1 });
    S.fm({ n: 100, t: 0.44, ratio: 3.5, index: 1, md: 0.15, d: 0.01, r: 0.4, vol: 0.05 });
    S.wet(0.35);
    S.gain(1.6);

  // page — a page turning: a band-limited "sa" with a small flutter underneath
  X.page = (S) => {
    S.noise({ a: 0.025, d: 0.05, r: 0.08, vol: 0.2, bp: 1700, bp2: 4400, fd: 0.09, q: 1.3 });
    S.noise({ t: 0.02, a: 0.01, d: 0.03, r: 0.04, vol: 0.08, bp: 700, q: 1.5 });
    S.noise({ t: 0.09, d: 0.004, r: 0.02, vol: 0.06, hp: 5000 });
    S.gain(1.75);
  };

  // swap (party order / row) — two light notes trading places (high → low) and a cloth rustle
  X.swap = (S) => {
    S.tone({ w: 'p25', n: 84, d: 0.03, r: 0.02, vol: 0.1, lp: 6000 });
    S.tone({ w: 'p25', n: 77, t: 0.06, d: 0.035, r: 0.05, vol: 0.1, lp: 6000 });
    S.tone({ w: 'triangle', n: 72, t: 0.06, d: 0.02, r: 0.05, vol: 0.1 });
    S.noise({ t: 0.01, a: 0.02, d: 0.05, r: 0.05, vol: 0.09, bp: 2400, bp2: 1400, fd: 0.07, q: 0.9 });
    S.gain(1.2);
  };

  // bell — the homeward bell (脱出): a clear little hand bell rung twice
  X.bell = (S) => {
    [0, 0.3].forEach((t, i) => {
      S.fm({ n: 93 - i * 2, t, ratio: 2.76, index: 1.3, md: 0.45, d: 0.01, r: 1.0, vol: 0.12 });
      S.tone({ w: 'sine', n: 105 - i * 2, t, a: 0.002, d: 0.01, r: 0.5, vol: 0.03 });
      S.noise({ t, d: 0.003, r: 0.015, vol: 0.05, hp: 6000 });
    });
    S.wet(0.45);
    S.gain(1.95);
  };

  // unlock — a sealed way opens (ice melts, vines wither, a stone door grinds): a short low
  // rumble, then bells climbing
  X.unlock = (S) => {
    S.noise({ a: 0.03, d: 0.2, r: 0.25, vol: 0.45, lp: 280, rate: 0.5 });
    S.tone({ w: 'sine', f: 62, f2: 40, sd: 0.4, a: 0.02, d: 0.2, r: 0.2, vol: 0.4 });
    for (let i = 0; i < 3; i++) S.noise({ t: 0.05 + i * 0.07, d: 0.01, r: 0.05, vol: 0.18, lp: 1300, rate: 0.7 });
    S.bells([79, 84, 88, 91, 96], 0.07, { t: 0.3, ratio: 3.5, index: 1.3, md: 0.2, d: 0.01, r: 0.45, vol: 0.08 });
    S.wet(0.35);
    S.gain(0.7);
  };

  // arrow (bows) — the string's twang, air cut, the thunk of the hit
  X.arrow = (S) => {
    S.tone({ w: 'triangle', f: 196, f2: 186, sd: 0.12, d: 0.12, r: 0.05, vol: 0.2, decay: 0.08 });  // びん
    S.tone({ w: 'sawtooth', f: 392, d: 0.06, r: 0.03, vol: 0.05, decay: 0.05, lp: 2400 });
    S.noise({ d: 0.004, r: 0.01, vol: 0.12, bp: 3000, q: 2 });
    S.noise({ t: 0.04, a: 0.03, d: 0.05, r: 0.03, vol: 0.2, bp: 1800, bp2: 6000, fd: 0.08, q: 1.4 }); // 風を切る
    S.noise({ t: 0.15, d: 0.01, r: 0.07, vol: 0.4, lp: 1500 });                                     // 刺さる
    S.tone({ w: 'sine', f: 220, f2: 90, sd: 0.07, t: 0.15, d: 0.01, r: 0.07, vol: 0.35 });
    S.gain(0.9);
  };

  // lash (whips) — a bending swish that snaps into a dry crack
  X.lash = (S) => {
    S.noise({ a: 0.06, d: 0.07, r: 0.02, vol: 0.24, bp: 500, bp2: 3200, fd: 0.13, q: 1.6 });
    S.noise({ t: 0.14, d: 0.003, r: 0.03, vol: 0.55, hp: 1800 });                                   // 破裂
    S.tone({ w: 'p50', f: 1400, f2: 500, sd: 0.02, t: 0.14, d: 0.004, r: 0.02, vol: 0.12 });

  };

  // parry — steel turning steel: a bright inharmonic ring with a click
  X.parry = (S) => {
    S.noise({ d: 0.004, r: 0.02, vol: 0.4, hp: 3500 });
    S.fm({ n: 91, ratio: 1.414, index: 3, md: 0.12, d: 0.005, r: 0.4, vol: 0.12 });

    S.tone({ w: 'sine', n: 103, a: 0.002, d: 0.01, r: 0.25, vol: 0.03, vib: [30, 20] });
    S.wet(0.3);
    S.gain(1.0);
  };

  // secret — a hidden passage gives way: stone shifting, a curious rising three-note figure
  // with a wobble (「ふしぎ」), a sparkle
  X.secret = (S) => {
    S.noise({ a: 0.02, d: 0.1, r: 0.15, vol: 0.3, lp: 500, rate: 0.6 });

    [[74, 0.12], [78, 0.2], [85, 0.28]].forEach(([n, t]) => S.tone({ w: 'triangle', n, t, a: 0.01, d: 0.06, r: 0.18, vol: 0.12, vib: [9, 18] }));
    S.tone({ w: 'p25', n: 85, n2: 97, sd: 0.25, t: 0.3, a: 0.02, d: 0.2, r: 0.2, vol: 0.035, lp: 6000, vib: [6, 30] });
    S.bells([97, 102], 0.06, { t: 0.42, ratio: 4, index: 1, md: 0.15, d: 0.01, r: 0.35, vol: 0.05 });
    S.wet(0.45);
    S.gain(1.1);
  };

  Object.assign(R.DB.sfx, X);
})(window.RPG);

<script>
// v2 の新しい効果音・ジングルの id（CORE、V2_PLAN §3.10）。P0 では今の音への付け替え。
// P1 で CORE が専用の音を作ったら、ここの付け替えを本物の定義に差し替える（id は変えない）。
//   効果音: spring（泉）・lead（手がかり帳に書いた）・lamp（灯籠がともる）・telegraph（ボスの予告）・bridge（つり橋）
//   ジングル: grow（HP/MP の伸び。今の levelup を使う、A30）
(function (R) {
  'use strict';
  const ALIAS_SFX = { spring: 'heal', lead: 'quill', lamp: 'light', telegraph: 'status', bridge: 'step_damage' };
  const ALIAS_MUSIC = { grow: 'levelup' };
  R.onData(function () {
    for (const id of Object.keys(ALIAS_SFX)) {
      if (R.DB.sfx[id]) continue;
      const to = ALIAS_SFX[id];
      R.DB.sfx[id] = function (S) { const f = R.DB.sfx[to] || R.DB.sfx.confirm; if (f) f(S); };
    }
    for (const id of Object.keys(ALIAS_MUSIC)) {
      if (!R.DB.music[id] && R.DB.music[ALIAS_MUSIC[id]]) R.DB.music[id] = R.DB.music[ALIAS_MUSIC[id]];
    }
  });
})(window.RPG);

<script>
// フィクスチャ（CORE。dev.html だけに入る）: V2_PLAN §2.6.7・§2.9
// 状態のフィクスチャ tools/fixtures/states/<担当>_<名前>.json と場面のフィクスチャ scenes/<担当>_<名前>.json は、
// ビルドが window.RPG_FIXTURES = {states: {name: obj}, scenes: {name: obj}} として dev.html に入れる。
//   状態: {desc, hero:{type,sex,name}, party:[ids], reserve, tier, gl:{id:n}|'auto', prof:'auto', flags, vars, items, gold, leads, map:{id, spawn}}
//   場面: {scene:'battle'|'screen'|'map'|'event', state?:<状態の名前>, setup?, id?, params?, map?, spawn?, event?}
// 'auto' は R.Growth.glAt / R.Rules.profAt（ゲームの中の関数。tools の関数は使わない）
(function (R) {
  'use strict';
  const Dev = (R.Dev = R.Dev || {});

  function table() { return (typeof window !== 'undefined' && window.RPG_FIXTURES) || { states: {}, scenes: {} }; }
  Dev.fixtures = function () { const t = table(); return { states: Object.keys(t.states || {}), scenes: Object.keys(t.scenes || {}) }; };

  /** 状態のフィクスチャから R.Game を組み立てる（マップには入らない）。→ 使ったフィクスチャ */
  Dev.applyState = function (name) {
    const fx = typeof name === 'string' ? (table().states || {})[name] : name;
    if (!fx) throw new Error('no state fixture ' + name);
    const chk = R.Contract.check('fixtureState', fx);
    if (!chk.ok) console.warn('[fixture] ' + name + ': ' + chk.errors.join('; '));
    R.State.newGame({ hero: fx.hero, seed: fx.seed != null ? fx.seed : 12345 });
    const G = R.Game;
    G.tier = fx.tier || 0;
    for (const id of fx.party || []) if (id !== 'hero') R.Party.join(id);
    for (const id of fx.reserve || []) { R.Party.join(id); }
    const all = (fx.party || []).concat(fx.reserve || []);
    for (const id of all) {
      const c = G.chars[id];
      if (!c) continue;
      c.gl = fx.gl === 'auto' || fx.gl == null ? R.Growth.glAt(G.tier, 'party') : (fx.gl[id] != null ? fx.gl[id] : c.gl);
      if (fx.prof === 'auto') { const p = R.Rules.profAt(G.tier, 'party'); c.wprof = c.wprof || {}; for (const w of (R.Rules.K.WTYPES || [])) c.wprof[w] = p; }
    }
    R.Party.fullHeal();
    Object.assign(G.flags, fx.flags || {});
    Object.assign(G.vars, fx.vars || {});
    Object.assign(G.items, fx.items || {});
    if (fx.gold != null) G.gold = fx.gold;
    for (const l of fx.leads || []) R.Leads.add(l);
    return fx;
  };

  /** 状態のフィクスチャを当ててマップに入る */
  Dev.fixture = async function (name) {
    const fx = Dev.applyState(name);
    R.Engine.clear();
    await R.Field.enter(fx.map.id, fx.map.spawn, { fade: 0, noAutosave: true });
    return true;
  };

  /** 場面のフィクスチャを開く */
  Dev.scene = async function (name) {
    const sc = typeof name === 'string' ? (table().scenes || {})[name] : name;
    if (!sc) throw new Error('no scene fixture ' + name);
    const chk = R.Contract.check('fixtureScene', sc);
    if (!chk.ok) console.warn('[fixture] ' + name + ': ' + chk.errors.join('; '));
    const stName = sc.state || 'core_stub_road';
    const fx = Dev.applyState(stName);
    R.Engine.clear();
    const mapId = sc.map || fx.map.id;
    await R.Field.enter(mapId, sc.spawn || fx.map.spawn, { fade: 0, noAutosave: true });
    if (sc.scene === 'battle') { R.Battle.start(sc.setup || { troop: 'tr_stub' }); return true; }
    if (sc.scene === 'screen') { R.Screens.open(sc.id, sc.params); return true; }
    if (sc.scene === 'event') { R.Events.run(sc.event, { map: mapId }); return true; }
    return true;
  };

  /** dev.html の起動: ?fixture=<状態> か ?scene=<場面>。どちらも無ければ false（ふつうにタイトルへ） */
  Dev.boot = async function () {
    const q = new URLSearchParams((typeof location !== 'undefined' && location.search) || '');
    try {
      if (q.get('fixture')) return await Dev.fixture(q.get('fixture'));
      if (q.get('scene')) return await Dev.scene(q.get('scene'));
    } catch (e) { console.error('[dev] ' + (e && e.message || e)); return false; }
    return false;
  };
})(window.RPG);
(function (R) { 'use strict'; R.devBoot = function () { return R.Dev.boot(); }; })(window.RPG);

//# sourceURL=src/dev/fixtures.js
</script>
<script>
// 起動（CORE）: 全ファイルを読んだ後に 1 回。仮の実装の穴埋め → データの後処理 → 起動の仕事 → タイトル
// R.Flow: タイトル → 新しいゲーム／つづき の流れ（タイトルの画面は MENUS、始まりの場所は R.DB.config.start）
(function (R) {
  'use strict';

  const Flow = (R.Flow = {
    /** 全部の場面を閉じてタイトルへ */
    async title() {
      R.Engine.clear();
      R.Engine.fade.a = 0;
      R.Game = null;
      R.Input.touchLayout('menu');
      R.Audio.bgm('title', { fade: 600 });
      const r = await R.Screens.open('title');
      if (r && r.cmd === 'continue' && R.Save.load(r.slot)) return Flow.resume();
      if (r && r.cmd === 'load') return Flow.resume();
      return Flow.newGame(r || {});
    },
    /** 新しいゲーム。R.DB.config.start = {map, spawn, event?} */
    async newGame(o) {
      o = o || {};
      const s = (R.DB.config && R.DB.config.start) || {};
      const hero = o.hero || (s.event ? null : await R.Screens.open('charcreate'));
      R.State.newGame({ hero, seed: o.seed });
      await R.Field.enter(s.map, s.spawn, { fade: 0, noAutosave: true });
      if (s.event) await R.Events.run(s.event, { map: s.map });
    },
    /** 読み込んだ R.Game の場所から続ける */
    async resume() {
      const p = R.Game.pos || {};
      await R.Field.enter(p.map, { x: p.x, y: p.y, dir: p.dir }, { fade: 260, noAutosave: true });
    },
  });

  function waitFonts() {
    if (typeof document === 'undefined' || !document.fonts || !document.fonts.load) return Promise.resolve();
    const loads = ['500 16px "Zen Maru Gothic"', '700 16px "Zen Maru Gothic"', '400 16px "Cinzel"', '700 16px "Cinzel"']
      .map((f) => document.fonts.load(f, 'あ灯A').catch(() => null));
    // 起動の待ちだけは実時間で数える（Engine はまだ回っていない）
    return Promise.race([Promise.all(loads), new Promise((res) => setTimeout(res, 2500))]);
  }

  R.boot = async function () {
    if (R._booted) return;
    R._booted = true;
    const canvas = document.getElementById('screen');
    R.Stubs.install();
    R.runDataHooks();
    R.Settings.load();
    R.Gfx.init(canvas);
    R.fit(true);
    window.addEventListener('resize', () => R.fit());
    window.addEventListener('orientationchange', () => R.fit());
    R.Input.init(canvas);
    R.Input.onAnyPress(() => { try { R.Audio.init(); } catch (e) { console.error(e); } });
    await waitFonts();
    R.Engine.addTick((dt, real) => { if (R.Game && R.Engine.has('field')) R.Game.playMs = (R.Game.playMs || 0) + real; });
    for (const fn of R._bootHooks) { try { await fn(); } catch (e) { console.error('boot hook failed', e); } }
    R.Engine.start(canvas);
    if (R.loadErrors.length) console.error('LOAD ERRORS:\n' + R.loadErrors.join('\n'));
    R.emit('booted');
    if (R.devBoot && (await R.devBoot())) return; // dev.html だけ: ?fixture= / ?scene=（src/dev/fixtures.js）
    Flow.title();
  };

  if (typeof document !== 'undefined' && document.getElementById) {
    if (document.readyState === 'complete') R.boot();
    else window.addEventListener('load', () => R.boot());
  }
})(window.RPG);

//# sourceURL=src/main.js
</script>
