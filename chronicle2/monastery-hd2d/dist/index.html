<title>鐘のならない修道院 HD-2D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* layout: one dark stage, the picture as wide as the window allows, a quiet caption strip under it */
:root{
  --night:#100d18; --night-2:#1a1626; --line:#3a3350; --bone:#e9dfcf; --dim:#a79db4; --lamp:#e9b06a;
  --f-d:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-b:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night)}
body{color:var(--bone);font-family:var(--f-b);font-size:15px;line-height:1.75;padding-block:20px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{margin:0;font-family:var(--f-d);font-weight:700;font-size:clamp(22px,3.2vw,34px);letter-spacing:.12em;line-height:1.3;text-wrap:balance}
.kicker{margin:0;color:var(--lamp);font-size:13px;letter-spacing:.18em}
.stage{position:relative;background:#07060b;outline:1px solid var(--line);aspect-ratio:16/9;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#view{display:block;width:100%;height:100%;outline:none}
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-d);color:#f4ecdf;text-shadow:0 1px 10px rgba(10,6,18,.9)}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#07060b;font-size:clamp(14px,2vw,18px);letter-spacing:.3em;color:var(--dim);transition:opacity .9s}
#loading.done{opacity:0}
#place{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:clamp(18px,3.4vw,40px);letter-spacing:.34em;opacity:0;transition:opacity 1.6s}
#place.on{opacity:1}
#place small{display:block;font-size:.42em;letter-spacing:.5em;color:#e9c79a;margin-top:.5em}
#prompt{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);padding:.45em 1.4em;font-size:clamp(13px,1.8vw,20px);letter-spacing:.16em;background:rgba(16,12,26,.72);border:1px solid rgba(233,199,154,.5);white-space:nowrap}
#stick{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border:1px solid rgba(244,236,223,.45);border-radius:50%;background:rgba(16,12,26,.25)}
#stick i{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(244,236,223,.55)}
.bar{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;color:var(--dim);font-size:13px}
.bar p{margin:0}
kbd{font-family:var(--f-b);font-size:12px;border:1px solid var(--line);background:var(--night-2);color:var(--bone);padding:1px 7px;border-radius:3px}
.sw{display:inline-flex;gap:0;border:1px solid var(--line)}
.sw button{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;border:0;padding:5px 12px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--night-2);color:var(--lamp)}
.sw button:focus-visible,#view:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.note{max-width:70ch;color:var(--dim);font-size:13.5px;margin:0}
.note b{color:var(--bone);font-weight:500}
@media (prefers-reduced-motion:reduce){#loading,#place{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>鐘のならない修道院</h1>
    <p class="kicker">HD-2D方式の試作</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="view" width="960" height="540" tabindex="0" aria-label="丘の上の修道院。矢印キーか画面のドラッグで主人公が歩きます"></canvas>
    <div class="hud">
      <div id="place">鐘のならない修道院<small>黄昏、二つの月</small></div>
      <div id="prompt" hidden></div>
      <div id="stick" hidden><i></i></div>
      <div id="loading">修道院を建てています…</div>
    </div>
  </div>
  <div class="bar">
    <p><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> または <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> で歩く（斜めも可）。スマホは画面をドラッグ。</p>
    <p>ぼかし <span class="sw" role="group" aria-label="奥と手前のぼかし"><button type="button" id="dofOn" aria-pressed="true">あり</button><button type="button" id="dofOff" aria-pressed="false">なし</button></span></p>
    <p>光のにじみ <span class="sw" role="group" aria-label="光のにじみ"><button type="button" id="bloomOn" aria-pressed="true">あり</button><button type="button" id="bloomOff" aria-pressed="false">なし</button></span></p>
  </div>
  <p class="note">背景は一枚絵ではなく、<b>立体をその場で描いています</b>。石や草の模様は主人公と同じ大きさのドットで、光と影、奥と手前のぼかしだけを今風にしています。歩けるのは土と石の道の上です。北東の見晴らし台まで行くと、二つの月が見えます。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script>
// ---- src/core/pal.js
// Palette. Every colour in the world comes from these ramps (dark -> light), built in the same colour language as the
// 96-dot hero: shadows lean navy/violet, lights lean warm cream, outlines are near-black violet.
(function () {
  const HD = (window.HD = window.HD || {});
  const P = (HD.P = {
    ink: '#17131f',          // deepest joint colour (the sprite has no black outlines: neither does the world)
    stone:  ['#17131f', '#262234', '#38354b', '#4e4b63', '#69667c', '#878294', '#a8a0a6', '#cbbfb4', '#e6d8c2'],   // cool grey-violet ashlar
    sand:   ['#201a20', '#332a30', '#4a3f44', '#655759', '#84736f', '#a39184', '#c0ae9a', '#d9c9b0', '#ebdfc8'],   // warm dressed stone (trim, tracery, crosses)
    slate:  ['#0a0e1a', '#131a2e', '#1c2944', '#293759', '#3b4c76', '#566b96', '#7c8fb4', '#a9b6d0'],              // roof slate, the hero's cape blues
    grass:  ['#10131a', '#181f24', '#222d2c', '#2e3d34', '#3e4f3c', '#536346', '#6f7a54', '#8f9468', '#b3b086'],   // dusk-lit grass: muted olive, never vivid green
    dirt:   ['#211920', '#352a2e', '#4b3d3b', '#64534a', '#7e6b5a', '#98856e', '#b09d84', '#c7b69c'],              // footpaths
    wood:   ['#170b0b', '#2d1913', '#44261a', '#5d3722', '#7c4c2f', '#9a603a', '#ba7e4c', '#dba266'],              // doors, pews, beams (hero's leather browns)
    moss:   ['#11171a', '#1b2623', '#28382c', '#3a4c36', '#525f42', '#727a54'],
    autumn: ['#2a1416', '#451c17', '#6a2c1c', '#8f4424', '#b5683a', '#cf8e58', '#e6b47a', '#f3d6ac'],              // the tree that still turns red; lantern oranges
    water:  ['#070a16', '#0d1428', '#152040', '#1f3058', '#2f4878', '#4a6aa0', '#7a9ac8'],
    iron:   ['#07070c', '#12131c', '#1f222e', '#303544', '#474d5e'],
    gold:   ['#3d2412', '#6a3f18', '#9a6520', '#c99332', '#f0c659', '#fff0a8'],                                     // bell bronze, candle flame
    glass:  ['#5a1830', '#a02a3a', '#d8663a', '#f0b040', '#f8e890', '#3a8a78', '#2a5a9a', '#6a3a9a', '#c05a9a'],    // stained glass (not a ramp: a set)
    sky:    ['#0f0d22', '#1b1838', '#2b2843', '#443a5c', '#5d4a66', '#84607a', '#a9747a', '#d09a84', '#ecc79a', '#fbe6c2'], // zenith -> horizon glow
  });
  // helpers ---------------------------------------------------------------------------------------------------------
  P.rgb = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  const cache = {};
  P.ramp = name => cache[name] || (cache[name] = P[name].map(P.rgb));
  // deterministic random: const r = HD.rng(123); r() -> [0,1)
  HD.rng = function (seed) {
    let a = (seed * 2654435761) >>> 0 || 1;
    const f = function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    f.range = (lo, hi) => lo + (hi - lo) * f();
    f.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * f());
    f.pick = arr => arr[Math.floor(f() * arr.length)];
    f.sign = () => (f() < 0.5 ? -1 : 1);
    return f;
  };
  // hash / value noise used by textures and geometry alike (2D, tile-free)
  HD.hash2 = function (x, y, s) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  HD.vnoise = function (x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi; const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy); const a = HD.hash2(xi, yi, s), b = HD.hash2(xi + 1, yi, s), c = HD.hash2(xi, yi + 1, s), d = HD.hash2(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
  HD.fbm = function (x, y, s, oct) { let v = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < (oct || 4); i++) { v += a * HD.vnoise(x * f, y * f, (s | 0) + i * 17); n += a; a *= 0.5; f *= 2; } return v / n; };
})();

// ---- src/core/tex.js
// Pixel-art textures, drawn in code from the palette ramps at 32 texels per world unit.
// Every texture is painted as "tone" (a fractional index into a ramp) and then snapped to the ramp with a light ordered
// dither, so the result is real limited-palette pixel art in the same colour language as the hero sprite.
(function () {
  const HD = (window.HD = window.HD || {});
  const P = HD.P, hash2 = HD.hash2, fbm = HD.fbm, vnoise = HD.vnoise;
  const T = (HD.T = { canvases: {}, DITHER: 0.4 });      // DITHER scales every ordered-dither amount: low = clean flat tones (modern), high = busy 16-bit checker
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16 - 0.5);

  // paint(w, h, fn) : fn(x, y) returns [rampName, tone] or [rampName, tone, ditherAmount]; tone is a fractional ramp index.
  T.paint = function (w, h, fn) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'), im = g.createImageData(w, h), d = im.data;
    for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) {
      const r = fn(x, y); const ramp = P.ramp(r[0]);
      let t = r[1] + BAYER[(x & 3) + ((y & 3) << 2)] * (r[2] === undefined ? 0.9 : r[2]) * T.DITHER;
      t = Math.max(0, Math.min(ramp.length - 1, Math.round(t)));
      const col = ramp[t]; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = r[3] === undefined ? 255 : r[3];
    }
    g.putImageData(im, 0, 0); return c;
  };
  // wrap a canvas as a crisp, mip-mapped, repeating colour texture
  T.fromCanvas = function (c, opt) {
    opt = opt || {};
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = opt.clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
    t.magFilter = opt.nearest ? THREE.NearestFilter : THREE.LinearFilter;   // the world shader does its own crisp-pixel sampling on a linear texture
    t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.anisotropy = 4;
    t.flipY = false;               // canvas row 0 = texture v 0: "y grows down the canvas" = "v grows up the wall" is handled per generator
    t.needsUpdate = true; return t;
  };
  const wrap = (v, n) => ((v % n) + n) % n;

  // ---------------------------------------------------------------------------------------------------- coursed ashlar
  // Rows of dressed blocks. Canvas y grows downward; generators below are written so that row 0 is the TOP of a course
  // stack when the texture is used with v up (the world shader flips v), i.e. highlights sit on upper edges.
  function ashlar(opt) {
    const W = opt.w || 256, H = opt.h || 256, seed = opt.seed || 1, ramp = opt.ramp || 'stone';
    const base = opt.base === undefined ? 4.6 : opt.base, r = HD.rng(seed);
    // course heights that add up to H
    const hs = []; let acc = 0; const hmin = opt.hmin || 13, hmax = opt.hmax || 19;
    while (acc < H) { let h = r.int(hmin, hmax); if (H - acc - h < hmin) h = H - acc; hs.push(h); acc += h; }
    const rowOf = new Int16Array(H), rowY0 = [];
    { let y = 0; hs.forEach((h, k) => { rowY0.push(y); for (let j = 0; j < h; j++) rowOf[y + j] = k; y += h; }); }
    // blocks per course
    const lmin = opt.lmin || 22, lmax = opt.lmax || 44;
    const rows = hs.map((h, k) => { const xs = []; let x = r.int(0, lmax); const start = x; while (x < start + W) { let l = r.int(lmin, lmax); if (start + W - x - l < lmin) l = start + W - x; xs.push({ x0: x, l, tone: base + r.range(-0.5, 0.5), warm: r() < (opt.warm === undefined ? 0.06 : opt.warm), moss: r() < (opt.moss === undefined ? 0.16 : opt.moss) ? r.range(0.3, 1) : 0, crack: r() < 0.14, id: r.int(0, 9999) }); x += l; } return { xs, start }; });
    const blockAt = (x, k) => { const row = rows[k]; const xx = wrap(x - row.start, W) + row.start; for (const b of row.xs) if (xx >= b.x0 && xx < b.x0 + b.l) return [b, xx - b.x0]; return [row.xs[0], 0]; };
    return T.paint(W, H, (x, y) => {
      const k = rowOf[y], h = hs[k], ly = y - rowY0[k]; const [b, lx] = blockAt(x, k);
      // mortar: last row and last column of each block, plus knocked-off corners
      const edgeB = ly === h - 1, edgeR = lx === b.l - 1;
      const corner = (lx === 0 || lx === b.l - 2) && (ly === 0 || ly === h - 2) && hash2(b.id, lx + ly, 3) < 0.7;
      if (edgeB || edgeR || corner) return [ramp, edgeB && edgeR ? 0.8 : 1.3 + hash2(x, y, seed) * 0.8, 0.5];
      let t = b.tone;
      t += (fbm(x * 0.09 + b.id, y * 0.14, seed, 3) - 0.5) * 1.5;                   // soft mottling inside the block
      t += (hash2(x, y, seed + 5) - 0.5) * 0.55;                                    // grain
      if (ly === 0) t += 1.15; else if (ly === 1) t += 0.45;                        // lit upper arris
      if (lx === 0) t += 0.6;                                                       // lit left arris
      if (ly === h - 2) t -= 1.0; else if (ly === h - 3) t -= 0.35;                 // shade above the bed joint
      if (lx === b.l - 2) t -= 0.7;
      // pits: a dark pixel with a light pixel under it
      const pit = hash2(x, y, seed + 9); if (pit < 0.012) t -= 2.0; else if (hash2(x, y - 1, seed + 9) < 0.012) t += 0.9;
      // a crack wandering down some blocks
      if (b.crack) { const cx = b.l * 0.5 + Math.sin(ly * 0.9 + b.id) * 2.2 + (hash2(b.id, ly, 7) - 0.5) * 2; if (Math.abs(lx - cx) < 0.7 && ly > 1) t -= 2.2; else if (Math.abs(lx - cx - 1) < 0.7 && ly > 1) t += 0.5; }
      // moss creeping up from the bed joint
      if (b.moss) { const m = b.moss * (ly / h) * 1.5 + (fbm(x * 0.2, y * 0.2, seed + 3, 2) - 0.55) * 2; if (m > 0.75) return ['moss', 1.6 + (m - 0.75) * 3 + (hash2(x, y, 4) - 0.5) + (ly === h - 2 ? -1 : 0), 0.8]; }
      return [b.warm ? 'sand' : ramp, t, 0.85];
    });
  }

  // ------------------------------------------------------------------------------ irregular stones (rubble, flagging)
  function cells(opt) {
    const W = opt.w || 128, H = opt.h || 128, seed = opt.seed || 2, cs = opt.cell || 18, ramp = opt.ramp || 'stone';
    const base = opt.base === undefined ? 4.2 : opt.base, gap = opt.gap === undefined ? 1.4 : opt.gap;
    const nx = Math.round(W / cs), ny = Math.round(H / cs), sx = W / nx, sy = H / ny;
    const pt = (i, j) => { const ii = wrap(i, nx), jj = wrap(j, ny); return [(i + 0.5 + (hash2(ii, jj, seed) - 0.5) * 0.86) * sx, (j + 0.5 + (hash2(ii, jj, seed + 1) - 0.5) * 0.86) * sy, hash2(ii, jj, seed + 2), hash2(ii, jj, seed + 3)]; };
    const flat = !!opt.flat;      // flat = paving seen from above (even light); otherwise wall stones (lit from above)
    return T.paint(W, H, (x, y) => {
      const ci = Math.floor(x / sx), cj = Math.floor(y / sy); let d1 = 1e9, d2 = 1e9, best = null;
      for (let j = cj - 1; j <= cj + 1; j++) for (let i = ci - 1; i <= ci + 1; i++) { const p = pt(i, j); const dx = (x - p[0]) * (opt.squash || 1), dy = y - p[1]; const d = Math.sqrt(dx * dx + dy * dy); if (d < d1) { d2 = d1; d1 = d; best = p; } else if (d < d2) d2 = d; }
      const e = d2 - d1;      // 0 on the joint
      if (e < gap) { if (opt.gapRamp && hash2(x, y, seed + 6) < (opt.gapFill || 0.6)) return [opt.gapRamp, 2.2 + hash2(x, y, 8) * 2.2, 0.9]; return [ramp, 1.1 + hash2(x, y, seed) * 0.9, 0.5]; }
      let t = base + (best[2] - 0.5) * 1.2;
      t += (fbm(x * 0.11 + best[3] * 50, y * 0.11, seed, 3) - 0.5) * 1.4 + (hash2(x, y, seed + 5) - 0.5) * 0.55;
      const dirY = (y - best[1]) / (sy * 0.5), dirX = (x - best[0]) / (sx * 0.5);
      if (flat) { if (e < gap + 1.2) t += dirY < 0 || dirX < 0 ? 0.7 : -0.8; }
      else { t += -dirY * 0.75 - dirX * 0.3; if (e < gap + 1.2) t += dirY < 0 ? 0.8 : -0.9; }
      const pit = hash2(x, y, seed + 9); if (pit < 0.012) t -= 1.8; else if (hash2(x, y - 1, seed + 9) < 0.012) t += 0.8;
      if (opt.moss && best[3] < opt.moss) { const m = fbm(x * 0.16, y * 0.16, seed + 4, 2) + (flat ? (1.6 - e * 0.25) * 0.25 : dirY * 0.25); if (m > 0.66) return ['moss', 1.8 + (m - 0.66) * 6 + (hash2(x, y, 4) - 0.5), 0.8]; }
      return [best[3] < (opt.warm || 0) ? 'sand' : ramp, t, 0.85];
    });
  }

  // ---------------------------------------------------------------------------------------------------- square pavers
  function pavers(opt) {
    const n = opt.n || 8, ts = opt.tile || 24, W = n * ts, seed = opt.seed || 3, ramp = opt.ramp || 'stone';
    return T.paint(W, W, (x, y) => {
      const i = Math.floor(x / ts), j = Math.floor(y / ts), lx = x - i * ts, ly = y - j * ts, id = hash2(i, j, seed), id2 = hash2(i, j, seed + 1);
      const chip = (lx < 2 || lx > ts - 4) && (ly < 2 || ly > ts - 4) && hash2(i * 7 + lx, j * 5 + ly, seed) < 0.55;
      if (lx === ts - 1 || ly === ts - 1 || chip) return [ramp, 1.2 + hash2(x, y, seed) * 0.8, 0.5];
      let t = (opt.base || 4.4) + (id - 0.5) * 1.3 + ((i + j) % 2 ? (opt.checker || 0) : 0);
      t += (fbm(x * 0.1, y * 0.1, seed, 3) - 0.5) * 1.5 + (hash2(x, y, seed + 5) - 0.5) * 0.5;
      if (ly === 0 || lx === 0) t += 0.8; if (ly === ts - 2 || lx === ts - 2) t -= 0.8;
      if (id2 < 0.22) { const cx = ts * 0.5 + Math.sin(ly * 0.5 + id * 40) * 4 + (ly - ts / 2) * (id - 0.5) * 1.5; if (Math.abs(lx - cx) < 0.6) t -= 2.3; }
      if (id2 > 0.8) { const m = fbm(x * 0.2, y * 0.2, seed + 3, 2) + Math.max(0, 3 - Math.min(lx, ly, ts - lx, ts - ly)) * 0.08; if (m > 0.7) return ['moss', 1.8 + (m - 0.7) * 6, 0.8]; }
      return [id2 > 0.45 && id2 < 0.5 ? 'sand' : ramp, t, 0.85];
    });
  }

  // ------------------------------------------------------------------------------------------------------ roof slates
  function slates(opt) {
    const W = opt.w || 128, H = opt.h || 120, seed = opt.seed || 4, rh = 10, tw = 12;
    return T.paint(W, H, (x, y) => {
      const j = Math.floor(y / rh), ly = y - j * rh, xo = x + (j % 2 ? tw / 2 : 0), i = Math.floor(wrap(xo, W) / tw), lx = wrap(xo, W) - i * tw, id = hash2(i, j, seed), id2 = hash2(i, j, seed + 1);
      // canvas y grows down the roof (toward the eave) after the shader's v flip, so the last rows of a slate are its exposed lower edge
      if (ly === rh - 1) return ['slate', 0.3, 0.3];
      if (lx === tw - 1) return ['slate', 0.9, 0.4];

// Small life in the air: dust motes drifting through the moonlight around the hero, and a few fireflies over the

        p.y += sin(time * 0.17 + seed.x * 30.0) * 0.5 + time * 0.04;
        p.z += cos(time * 0.13 + seed.z * 50.0) * 1.2;

        vec3 e = abs(p - center) / (box * 0.5);

// The forest ring: dark pines (a few broadleaf among them) on the slopes all round the plateau, with shrubs, ferns and
// rough grass on the top of the slope. Everything stands on the terrain, which falls away steeply outside the walls, so
// from the game camera the ring is a wall of treetops below and around the abbey.
//
// Sight lines (the camera looks north, 36 degrees down, so whatever stands south of a thing covers it):
//  - south slope: a tree's top may not rise above the line of sight to the foot of the boundary wall; close under the
//    wall that leaves only shrubs, ferns and young pines, and the tall pines start further down where the ground is lower;
//  - the corridor of the hill steps stays clear (nothing within 4.5 of the stair axis, undergrowth only out to 7);
//  - east and west: trunks start 3.4 outside the walls, so no crown hangs over the plateau.

<script>
(function () {
  const $ = id => document.getElementById(id), canvas = $('view'), loading = $('loading'), place = $('place'), prompt = $('prompt'), stickEl = $('stick'), stage = $('stage');
  const fail = msg => { loading.classList.remove('done'); loading.textContent = msg; };
  if (!window.THREE) return fail('描画の部品を読み込めませんでした。ページを開き直してください。');
  const test = document.createElement('canvas').getContext('webgl2'); if (!test) return fail('このブラウザでは立体の描画（WebGL2）が使えません。');
  const img = new Image();
  img.onerror = () => fail('主人公の絵を読み込めませんでした。');
  img.onload = () => setTimeout(() => {
    try {
      const game = HD.Game.start({ canvas, heroImage: img, heroSpec: HD.HERO_SPEC,
        onReady() { loading.classList.add('done'); setTimeout(() => place.classList.add('on'), 500); setTimeout(() => place.classList.remove('on'), 5200); },
        onSpot(s) { prompt.hidden = !s; if (s) prompt.textContent = s.label + (s.kind === 'exit' ? '（試作はここまで）' : ''); },
        onStick(s) { stickEl.hidden = !s; if (s) { const r = stage.getBoundingClientRect(); stickEl.style.left = (s.x0 - r.left) + 'px'; stickEl.style.top = (s.y0 - r.top) + 'px'; const m = Math.hypot(s.dx, s.dy) || 1, k = Math.min(1, 27 / m); stickEl.firstElementChild.style.transform = 'translate(' + s.dx * k + 'px,' + s.dy * k + 'px)'; } } });
      const sw = (a, b, fn) => { const set = on => { $(a).setAttribute('aria-pressed', on); $(b).setAttribute('aria-pressed', !on); fn(on); }; $(a).onclick = () => set(true); $(b).onclick = () => set(false); };
      sw('dofOn', 'dofOff', on => { if (game.post) game.post.params.dof.enabled = on; });
      sw('bloomOn', 'bloomOff', on => { if (game.post) game.post.params.bloom.enabled = on; });
      canvas.focus({ preventScroll: true });
    } catch (e) { console.error(e); fail('組み立ての途中で止まりました。ページを開き直してください。'); }
  }, 30);
  img.src = HD.HERO_SRC;
})();
</script>
