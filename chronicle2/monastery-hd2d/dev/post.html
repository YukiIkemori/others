<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>post.js test</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="../vendor/three.min.js"></script>
<script src="../src/core/pal.js"></script>
<script src="../src/core/light.js"></script>
<script src="../src/core/post.js"></script>
<script>
// Stand-in scene for the post pipeline, seen from the game camera.
// Query: ?dof=0 &bloom=0 &ao=0 (switch effects off)  ?split=1 (left half raw, right half post)  ?debug=1..4 (AO, CoC, depth, bloom)
//        ?ldr=1 (force the 8-bit path)  ?msaa=0  ?still=1 (frozen time: identical frames)  ?focus=36.5  ?nopost=1 (plain renderer, for reference)
(function () {
  const T = THREE, P = HD.P, q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? +q.get(k) : d);
  const renderer = new T.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(HD.Light.FOG_COLOR, 1);
  document.body.appendChild(renderer.domElement);
  const scene = new T.Scene();
  const rig = HD.Light.setup(scene, renderer);

  const PITCH = 36 * Math.PI / 180, DIST = 36.5;
  const camera = new T.PerspectiveCamera(26, innerWidth / innerHeight, 1, 600);
  camera.position.set(0, 1.5 + DIST * Math.sin(PITCH), DIST * Math.cos(PITCH));
  camera.lookAt(0, 1.5, 0);

  // ---- pixel-art canvas textures (32 texels per unit) --------------------------------------------------------
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new T.CanvasTexture(c);
    t.encoding = T.sRGBEncoding; t.magFilter = T.NearestFilter; t.minFilter = repeat ? T.LinearMipmapLinearFilter : T.NearestFilter;
    t.generateMipmaps = !!repeat; t.anisotropy = repeat ? 4 : 1;
    if (repeat) t.wrapS = t.wrapT = T.RepeatWrapping;
    return t;
  }
  function px(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
  function stones(g, W, H, ramp, seed, bw, bh, stagger) {      // coursed blocks with ink mortar, lit top-left edge, speckle
    const r = HD.rng(seed);
    px(g, 0, 0, W, H, P.ink);
    for (let y = 0, row = 0; y < H; y += bh, row++) {
      const off = stagger ? (row % 2) * (bw >> 1) : 0;
      for (let x = -bw; x < W; x += bw) {
        const x0 = x + off, base = r.int(3, 5);
        for (const dx of [0, W]) {                              // wrap
          px(g, x0 + dx, y, bw - 1, bh - 1, ramp[base]);
          px(g, x0 + dx, y, bw - 1, 1, ramp[base + 1]); px(g, x0 + dx, y, 1, bh - 1, ramp[base + 1]);
          px(g, x0 + dx, y + bh - 2, bw - 1, 1, ramp[base - 1]);
        }
        for (let i = 0; i < 9; i++) { const sx = x0 + r.int(1, bw - 3), sy = y + r.int(1, bh - 3); const c = ramp[base + r.pick([-1, -1, 1])]; px(g, sx, sy, r.int(1, 2), 1, c); px(g, sx + W, sy, 1, 1, c); }
      }
    }
  }
  const groundTex = canvasTex(256, 256, (g, W, H) => {
    stones(g, W, H, P.stone, 11, 32, 32, true);
    const r = HD.rng(5);
    for (let i = 0; i < 260; i++) { const x = r.int(0, W - 1), y = r.int(0, H - 1); if (HD.fbm(x / 40, y / 40, 3) > 0.55) px(g, x, y, r.int(1, 3), 1, P.moss[r.int(2, 4)]); }
  }, true);
  const wallTex = canvasTex(128, 128, (g, W, H) => stones(g, W, H, P.sand, 23, 32, 16, true), true);
  const darkTex = canvasTex(128, 128, (g, W, H) => stones(g, W, H, P.stone, 31, 16, 16, true), true);

  function phong(tex, rx, ry) { const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return new T.MeshPhongMaterial({ map: t, specular: 0x000000 }); }
  function add(geo, mat, x, y, z) { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; }

  // ---- ground: a plateau whose north-east part is cut away so that far things (below, beyond) are in view ---------
  add(new T.BoxGeometry(128, 4, 80), phong(groundTex, 16, 10), -60, -2, 10);            // west: x -124..4, z -30..50
  add(new T.BoxGeometry(64, 4, 64), phong(groundTex, 8, 8), 36, -2, 18);                // east: x 4..68, ends at z = -14
  // far towers rising from below (tops in the upper right of the frame)
  [[14, -6, -30, 6], [24, -16, -46, 7], [36, -10, -40, 5], [18, -30, -70, 8], [32, -34, -84, 9], [8, -44, -100, 7]].forEach((a, i) => {
    add(new T.BoxGeometry(a[3], 120, a[3]), phong(i % 2 ? darkTex : wallTex, a[3] / 4, 30), a[0], a[1] - 60, a[2]);
    add(new T.ConeGeometry(a[3] * 0.8, a[3] * 1.2, 4, 1).rotateY(Math.PI / 4), phong(darkTex, 2, 1), a[0], a[1] + a[3] * 0.6, a[2]);
  });
  // walls, columns and boxes on the plateau, far to near
  add(new T.BoxGeometry(30, 9, 2), phong(wallTex, 7.5, 2.25), -17, 4.5, -22);
  add(new T.BoxGeometry(2, 6, 14), phong(wallTex, 3.5, 1.5), -3, 3, -15);
  const colGeo = h => new T.CylinderGeometry(0.7, 0.8, h, 12);
  [[-10, 7, -16], [-6, 7, -9], [8, 7, -9], [-11, 6, -2], [10, 6, 0], [-7, 5, 4], [6.5, 5, 5.5]].forEach(a => {
    add(colGeo(a[1]), phong(wallTex, 1, a[1] / 4), a[0], a[1] / 2, a[2]);
    add(new T.BoxGeometry(2, 0.5, 2), phong(darkTex, 0.5, 0.125), a[0], 0.25, a[2]);
    add(new T.BoxGeometry(1.9, 0.5, 1.9), phong(darkTex, 0.5, 0.125), a[0], a[1] + 0.25, a[2]);
  });
  add(new T.BoxGeometry(3, 2, 3), phong(darkTex, 0.75, 0.5), 3.5, 1, -3);
  add(new T.BoxGeometry(2, 1, 2), phong(wallTex, 0.5, 0.25), -3.5, 0.5, 1.5);
  add(new T.BoxGeometry(5, 3, 1), phong(wallTex, 1.25, 0.75), 13, 1.5, -6);
  // tall things close to the camera (blurred foreground entering from the bottom and the sides)
  add(colGeo(20), phong(wallTex, 1, 5), -5.2, 10, 15);
  add(new T.BoxGeometry(1.6, 21, 1.6), phong(darkTex, 0.5, 5), 6.5, 10.5, 19);
  add(new T.BoxGeometry(5, 14.5, 1.2), phong(wallTex, 1.25, 3.6), 12.5, 7.25, 12);
  const bar = add(new T.BoxGeometry(0.35, 0.35, 14), new T.MeshPhongMaterial({ color: P.iron[3], specular: 0 }), -9.5, 15.2, 16); bar.rotation.y = 0.9;

  // ---- hero: upright alpha-tested card, 3 units = 96 dots ------------------------------------------------------
  const heroTex = canvasTex(40, 96, (g) => {
    const o = P.ink;
    const body = (x, y, w, h, c) => { px(g, x - 1, y - 1, w + 2, h + 2, o); px(g, x, y, w, h, c); };
    body(13, 4, 14, 14, P.sand[7]);                                   // head
    px(g, 13, 4, 14, 6, P.wood[3]); px(g, 16, 12, 2, 2, o); px(g, 22, 12, 2, 2, o); px(g, 18, 15, 4, 1, P.autumn[3]);
    body(9, 20, 22, 34, P.slate[4]);                                  // cape with a hard 1-dot checker
    for (let y = 20; y < 54; y++) for (let x = 9; x < 31; x++) if (((x ^ y) & 1) === 0 && x > 19) px(g, x, y, 1, 1, P.slate[6]);
    for (let y = 22; y < 54; y += 4) px(g, 10, y, 9, 1, P.slate[2]);  // 1-dot stripes
    px(g, 19, 20, 1, 34, P.gold[4]); px(g, 9, 36, 22, 2, P.wood[4]); px(g, 18, 35, 4, 4, P.gold[5]);
    body(4, 22, 4, 22, P.slate[5]); body(32, 22, 4, 22, P.slate[5]);  // arms
    body(4, 45, 4, 4, P.sand[7]); body(32, 45, 4, 4, P.sand[7]);
    body(11, 56, 7, 30, P.wood[2]); body(22, 56, 7, 30, P.wood[2]);   // legs
    body(9, 87, 10, 8, P.wood[5]); body(21, 87, 10, 8, P.wood[5]);    // boots
    px(g, 37, 2, 1, 60, P.sand[8]); px(g, 36, 2, 3, 2, P.gold[5]); px(g, 36, 1, 3, 1, o); px(g, 36, 62, 3, 1, o); px(g, 35, 2, 1, 60, o); px(g, 39, 2, 1, 60, o);   // staff: 1-dot bright line
  });
  function card(tex, w, h, x, z, bright) {
    const mat = new T.MeshPhongMaterial({ map: tex, alphaTest: 0.5, side: T.DoubleSide, specular: 0, emissive: bright ? 0x8a8078 : 0x000000, emissiveMap: bright ? tex : null });
    const m = new T.Mesh(new T.PlaneGeometry(w, h), mat);
    m.position.set(x, h / 2, z); m.castShadow = true; m.receiveShadow = false;
    m.customDepthMaterial = new T.MeshDepthMaterial({ depthPacking: T.RGBADepthPacking, map: tex, alphaTest: 0.5 });
    scene.add(m); return m;
  }
  card(heroTex, 1.25, 3, 0, 0, true);
  const bushTex = canvasTex(64, 64, (g) => {                          // an alpha-tested shrub card
    const r = HD.rng(9), blobs = [];
    for (let i = 0; i < 26; i++) { const a = r() * 6.283, d = Math.sqrt(r()) * 20; blobs.push([32 + Math.cos(a) * d, 38 + Math.sin(a) * d * 0.75, r.range(5, 9), r.int(3, 6)]); }
    for (const b of blobs) { g.fillStyle = P.ink; g.beginPath(); g.arc(b[0], b[1], b[2] + 1, 0, 7); g.fill(); }
    for (const b of blobs) { g.fillStyle = P.grass[b[3]]; g.beginPath(); g.arc(b[0], b[1], b[2], 0, 7); g.fill(); g.fillStyle = P.grass[b[3] + 2]; g.beginPath(); g.arc(b[0] - 2, b[1] - 2, b[2] * 0.45, 0, 7); g.fill(); }
    const id = g.getImageData(0, 0, 64, 64); for (let i = 3; i < id.data.length; i += 4) id.data[i] = id.data[i] > 127 ? 255 : 0; g.putImageData(id, 0, 0);
  });
  card(bushTex, 2, 2, 4.2, 2.2, false); card(bushTex, 2, 2, -5, -5.5, false); card(bushTex, 2.4, 2.4, -1.5, 12.5, false).position.y = 13.4;

  // ---- lights that bloom: lantern spheres + additive glow sprites, a lit window, a moon ---------------------------
  const glowTex = canvasTex(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  glowTex.magFilter = glowTex.minFilter = T.LinearFilter;
  const sph = new T.SphereGeometry(0.22, 12, 8);
  function lantern(x, y, z, light, s) {
    const m = new T.Mesh(sph, new T.MeshBasicMaterial({ color: new T.Color(4.2, 2.3, 0.9), fog: false })); m.position.set(x, y, z); m.scale.setScalar(s || 1); scene.add(m);
    const sp = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: new T.Color(0.9, 0.45, 0.16), blending: T.AdditiveBlending, depthWrite: false, transparent: true }));
    sp.position.set(x, y, z); sp.scale.setScalar(3.2 * (s || 1)); scene.add(sp);
    if (light) { const l = new T.PointLight('#ffb060', 1.5, 13, 1.6); l.position.set(x, y + 0.2, z + 0.6); scene.add(l); }
  }
  lantern(-6, 4.2, -8.2, true); lantern(8, 4.2, -8.2, true); lantern(-2, 3.2, 1.6, true); lantern(10, 3.4, 0.9, false); lantern(-11, 3.4, -1.1, false);
  lantern(-14, 5, -20.8, false); lantern(-22, 5, -20.8, false); lantern(-7, 5, -20.8, false);
  lantern(14, -5, -26.9, false, 1.4); lantern(24, -15, -42.4, false, 1.6); lantern(18, -29, -65.9, false, 2); lantern(32, -33, -79.4, false, 2); lantern(36, -9, -37.4, false, 1.4);
  lantern(-5.2, 16.5, 15.9, false, 0.8); lantern(12.5, 13, 12.7, false, 0.8);
  const win = canvasTex(32, 64, (g) => {                              // stained glass: emissive, pixel leading
    px(g, 0, 0, 32, 64, P.ink);
    for (let y = 2; y < 62; y += 6) for (let x = 2; x < 30; x += 7) { const d = Math.hypot(x - 14, (y - 40) * 0.6); if (y > 14 || Math.abs(x - 13) < 14 - (14 - y) * 1.6) px(g, x, y, 6, 5, P.glass[((x + y * 3) >> 2) % 9]); if (d < 6) px(g, x, y, 6, 5, P.glass[4]); }
  });
  const wm = new T.Mesh(new T.PlaneGeometry(2, 4), new T.MeshBasicMaterial({ map: win, color: new T.Color(2.6, 2.4, 2.2) })); wm.position.set(-18, 4.6, -20.97); scene.add(wm);
  const wm2 = wm.clone(); wm2.position.x = -10.5; scene.add(wm2);
  const wm3 = wm.clone(); wm3.scale.set(0.7, 0.62, 1); wm3.position.set(13, 1.55, -5.47); scene.add(wm3);
  // palette swatches: flat colours to judge what the grade does to them
  ['autumn', 'gold', 'grass', 'moss', 'water', 'slate', 'wood', 'dirt'].forEach((n, i) => { for (let j = 0; j < 3; j++) {
    const m = add(new T.BoxGeometry(0.5, 0.5, 0.5), new T.MeshPhongMaterial({ color: P[n][[2, 4, P[n].length - 2][j]], specular: 0 }), -2.6 + i * 0.75, 0.25 + j * 0.5, 4.2); m.castShadow = false; } });
  [0, 1, 2, 3, 4, 5, 6, 7, 8].forEach(i => { const m = add(new T.BoxGeometry(0.5, 0.5, 0.5), new T.MeshBasicMaterial({ color: P.glass[i] }), -2.6 + i * 0.65, 0.25, 5.4); m.castShadow = false; });
  // sky dome (fog colour low, glow towards the horizon) and the white moon, low and far
  const skyTex = canvasTex(4, 256, (g) => {
    const gr = g.createLinearGradient(0, 0, 0, 256), s = P.sky;
    [[0, s[0]], [0.3, s[2]], [0.44, s[5]], [0.5, s[8]], [0.56, s[4]], [0.75, HD.Light.FOG_COLOR], [1, s[1]]].forEach(a => gr.addColorStop(a[0], a[1]));
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  });
  skyTex.magFilter = skyTex.minFilter = T.LinearFilter;
  const sky = new T.Mesh(new T.SphereGeometry(520, 24, 16), new T.MeshBasicMaterial({ map: skyTex, side: T.BackSide, fog: false, depthWrite: false }));
  sky.position.copy(camera.position); sky.renderOrder = -10; scene.add(sky);
  const moon = new T.Mesh(new T.CircleGeometry(15, 40), new T.MeshBasicMaterial({ color: new T.Color(3.0, 2.7, 2.2), fog: false }));
  moon.position.set(52, -150, -330); moon.lookAt(camera.position); scene.add(moon);

  // ---- post ------------------------------------------------------------------------------------------------
  const post = HD.Post.create(renderer, innerWidth, innerHeight, { forceLDR: q.get('ldr') === '1', samples: num('msaa', 1) ? 4 : 0 });
  window.post = post; window.scene = scene; window.camera = camera; window.renderer = renderer;
  if (q.get('dof') === '0') post.params.dof.enabled = false;
  if (q.get('bloom') === '0') post.params.bloom.enabled = false;
  if (q.get('ao') === '0') post.params.ao.enabled = false;
  if (q.get('split') === '1') post.params.split = 0.5;
  post.params.debug = num('debug', 0);
  const focus = num('focus', DIST), still = q.get('still') === '1', nopost = q.get('nopost') === '1';
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); post.setSize(innerWidth, innerHeight);
  });
  let frames = 0;
  function frame(ms) {
    const t = still ? 1.0 : ms / 1000;
    rig.follow(0, 0);
    if (nopost) { renderer.outputEncoding = T.sRGBEncoding; renderer.render(scene, camera); }
    else post.render(scene, camera, { focus: focus, time: t });
    const e = renderer.getContext().getError(); if (e) window.HD_GLERR = e;   // test page only: getError is slow
    if (++frames >= 2) window.HD_READY = true;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
