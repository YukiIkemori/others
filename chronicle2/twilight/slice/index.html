<style>
/* Sizes follow Octopath Traveler II (design doc 13): --u is one pixel of a 1920x1080 screen, so "28u" is 28 px at 1080p.

:root {

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #070607; color: var(--paper); font-family: var(--serif); overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

.u15 { font-size: calc(15 * var(--u)); } .u12 { font-size: calc(12 * var(--u)); }

#fade { inset: 0; background: #060506; opacity: 1; transition: opacity .9s ease; z-index: 30; }

/* the name of the place, on arriving */

#title .jp { font-size: calc(58 * var(--u)); font-weight: 500; letter-spacing: .3em; margin-right: -.3em; line-height: 1.5; text-shadow: 0 0 .5em rgba(8, 6, 8, .9), 0 .05em .1em rgba(0, 0, 0, .7); }
#title .rule { height: 1px; width: calc(420 * var(--u)); margin: calc(8 * var(--u)) auto; background: linear-gradient(90deg, transparent, var(--gold) 18%, var(--gold) 82%, transparent); transform: scaleX(0); transition: transform 1.6s cubic-bezier(.2, .7, .2, 1) .3s; }

/* interaction prompt */

  transform: translate(-50%, -100%); padding: calc(7 * var(--u)) calc(20 * var(--u)) calc(8 * var(--u)); font-size: calc(22 * var(--u)); letter-spacing: .14em;

  border-radius: calc(3 * var(--u)); }

.dialog.on { opacity: 1; transform: none; visibility: visible; }
#dialog { left: 50%; bottom: calc(54 * var(--u)); width: calc(1040 * var(--u)); margin-left: calc(-520 * var(--u)); }

  box-shadow: 0 0 0 1px rgba(40, 30, 22, .9), inset 0 0 0 calc(3 * var(--u)) rgba(227, 215, 187, .9), inset 0 0 0 calc(4 * var(--u)) rgba(120, 96, 62, .55), inset 0 0 calc(40 * var(--u)) rgba(120, 92, 54, .28), 0 calc(10 * var(--u)) calc(34 * var(--u)) rgba(0, 0, 0, .5); border-radius: calc(3 * var(--u)); }
.dialog .who { position: absolute; left: calc(40 * var(--u)); top: calc(-20 * var(--u)); padding: calc(4 * var(--u)) calc(24 * var(--u)) calc(6 * var(--u)); font-size: calc(21 * var(--u)); letter-spacing: .18em; color: var(--paper);
  background: #2a2220; box-shadow: inset 0 0 0 1px var(--gold-dim); }

  background: linear-gradient(180deg, rgba(10, 8, 9, 0), rgba(10, 8, 9, .82) 40%); color: var(--paper); text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
.helpbar .keys { margin-left: auto; font-size: calc(15 * var(--u)); color: var(--paper-dim); letter-spacing: .12em; white-space: nowrap; }

#notice.on { opacity: 1; }

/* start screen */

.card { position: relative; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); border-radius: calc(4 * var(--u)); padding: calc(14 * var(--u)) calc(24 * var(--u)) calc(14 * var(--u)) calc(118 * var(--u)); min-height: calc(112 * var(--u)); cursor: pointer; }
